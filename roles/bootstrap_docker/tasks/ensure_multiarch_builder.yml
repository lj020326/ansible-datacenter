---

- name: Docker | Multi-Arch | Configure cross-platform QEMU emulation
  when:
    - bootstrap_docker__service_started | bool
    - bootstrap_docker__qemu_packages is defined
  block:
    - name: Docker | Multi-Arch | Install cross-platform QEMU emulation support
      ansible.builtin.package:
        name: "{{ bootstrap_docker__qemu_packages }}"
        state: present

    - name: Docker | Multi-Arch | Ensure binfmt_misc kernel filesystem is mounted
      ansible.posix.mount:
        path: /proc/sys/fs/binfmt_misc
        src: binfmt_misc
        fstype: binfmt_misc
        state: mounted

    # This needs to run on BOTH RedHat and Debian to tell the kernel to load package definitions
    - name: Docker | Multi-Arch | Restart systemd-binfmt service to load handlers
      ansible.builtin.systemd:
        name: systemd-binfmt
        state: restarted
      register: __binfmt_restart_result
      failed_when:
        - __binfmt_restart_result is failed
        - "'Host is down' not in __binfmt_restart_result.msg"
        - "'connect to system bus' not in __binfmt_restart_result.msg"
        - "'Service is not loaded' not in __binfmt_restart_result.msg"

    # Dynamic lookups: Ensure the kernel actually registered the opposite architectures
    - name: Docker | Multi-Arch | Find registered cross-compilation kernel emulators
      ansible.builtin.find:
        paths: /proc/sys/fs/binfmt_misc
        patterns: >-
          {{
            ['*x86*', '*amd64*']
            if ansible_facts['architecture'] in ['aarch64', 'arm64']
            else ['*aarch64*', '*arm*']
          }}
      register: __found_binfmt_handlers

    # Clean Host Kernel Emulation Layer Setup
    - name: Docker | Multi-Arch | Register handlers via binfmt container if missing from kernel
      when: __found_binfmt_handlers.matched | int == 0
      community.docker.docker_container:
        name: binfmt_installer
        image: tonistiigi/binfmt
        command: --install arm64
        privileged: true
        cleanup: true
        detach: false
        state: started

    # Re-verify handlers after container registration running
    - name: Docker | Multi-Arch | Re-verify cross-compilation kernel emulators
      when: __found_binfmt_handlers.matched | int == 0
      ansible.builtin.find:
        paths: /proc/sys/fs/binfmt_misc
        patterns: >-
          {{
            ['*x86*', '*amd64*']
            if ansible_facts['architecture'] in ['aarch64', 'arm64']
            else ['*aarch64*', '*arm*']
          }}
      register: __found_binfmt_handlers_retry

    - name: Docker | Multi-Arch | Verify cross-compilation registration handlers exist
      ansible.builtin.assert:
        that: >
          (__found_binfmt_handlers.matched | int > 0) or
          (__found_binfmt_handlers_retry.matched | d(0) | int > 0)
        fail_msg: "No binfmt handlers found for cross-compiling on this {{ ansible_facts['architecture'] }} host."
        success_msg: "Successfully verified dynamic binfmt emulation handlers are active."

    # =========================================================================
    # Generate BuildKit Configuration for Trust & Insecure Registries
    # =========================================================================
    - name: Docker | Multi-Arch | Create BuildKit configuration directory
      ansible.builtin.file:
        path: /etc/docker/buildx
        state: directory
        mode: '0755'

    - name: Docker | Multi-Arch | Create host buildx cert directories
      when: bootstrap_docker__docker_registries is defined
      ansible.builtin.file:
        path: "{{ bootstrap_docker__buildkit_certs_dir }}/{{ item.endpoint }}"
        state: directory
        mode: '0755'
      loop: "{{ bootstrap_docker__docker_registries }}"

    - name: Docker | Multi-Arch | Copy host registry cert chains to buildx cert context
      ansible.builtin.copy:
        src: "{{ bootstrap_docker__ca_local_cert_dir }}/{{ item.host }}.chain.pem"
        dest: "{{ bootstrap_docker__buildkit_certs_dir }}/{{ item.endpoint }}/ca.crt"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      loop: "{{ bootstrap_docker__docker_registries }}"
      when: bootstrap_docker__docker_registries is defined
      register: __buildx_certs_copied

    - name: Docker | Multi-Arch | Generate clean buildkitd configuration
      ansible.builtin.copy:
        dest: /etc/docker/buildx/buildkitd.toml
        mode: '0644'
        content: |
          debug = true

          {% if bootstrap_docker__docker_registries is defined %}
          {% for registry in bootstrap_docker__docker_registries %}
          # Configuration for {{ registry.endpoint }}
          [registry."{{ registry.endpoint }}"]
            ca = ["{{ bootstrap_docker__buildkit_certs_dir }}/{{ registry.endpoint }}/ca.crt"]
            {% if registry.is_passthru | default(false) | bool -%}
            http = true
            insecure = true
            {% endif %}

          {% endfor %}
          {% endif %}
      register: __buildkit_toml_generated
      notify: Docker | Restart buildkit

    - name: Docker | Multi-Arch | Flush handlers to ensure BuildKit is running with the clean configuration
      ansible.builtin.meta: flush_handlers

    # =========================================================================
    # APPROACH A: Permanent System Service (PREFERRED DEFAULT)
    # =========================================================================
    - name: Docker | Multi-Arch | Setup Systemd Service Approach
      when: bootstrap_docker__multiarch_builder_driver == "service"
      block:
        - name: Docker | Multi-Arch (Service) | Download and unarchive BuildKit binaries
          ansible.builtin.unarchive:
            src: "{{ bootstrap_docker__buildkit_url }}"
            dest: /usr/local/bin
            remote_src: true
            extra_opts: [--strip-components=1]
            creates: /usr/local/bin/buildkitd

        - name: Docker | Multi-Arch (Service) | Deploy Systemd Unit File
          ansible.builtin.copy:
            dest: /etc/systemd/system/buildkit.service
            mode: '0644'
            content: |
              [Unit]
              Description=BuildKit
              Documentation=https://github.com/moby/buildkit
              After=docker.service binfmt-support.service

              [Service]
              Type=notify
              ExecStart=/usr/local/bin/buildkitd --config /etc/docker/buildx/buildkitd.toml
              ExecStartPost=/usr/bin/timeout 5 sh -c 'while [ ! -S /run/buildkit/buildkitd.sock ]; do sleep 0.2; done; chgrp docker /run/buildkit/buildkitd.sock && chmod 0660 /run/buildkit/buildkitd.sock'
              KillMode=process
              Delegate=yes
              LimitNOFILE=infinity
              LimitNPROC=infinity

              [Unit]
              Requires=docker.socket

              [Install]
              WantedBy=multi-user.target
          register: __buildkit_service_file

        - name: Docker | Multi-Arch (Service) | Force daemon-reload if service modified
          when: __buildkit_service_file.changed # noqa: no-handler
          ansible.builtin.systemd:
            daemon_reload: true

        - name: Docker | Multi-Arch (Service) | Ensure BuildKit daemon is enabled and running
          ansible.builtin.systemd:
            name: buildkit
            state: "{{ 'restarted' if __buildkit_toml_generated.changed else 'started' }}"
            enabled: true

        - name: Docker | Multi-Arch (Service) | Get list of existing buildx builders
          ansible.builtin.command: docker buildx ls
          register: buildx_ls
          changed_when: false

        - name: Docker | Multi-Arch (Service) | Clean container builder if shifting driver patterns
          when: "'multiarch-builder' in buildx_ls.stdout"
          ansible.builtin.command: docker buildx rm multiarch-builder
          changed_when: true

        - name: Docker | Multi-Arch (Service) | Clear conflicting buildx context if it exists without correct constraints
          when: "'systemd-builder' in buildx_ls.stdout"
          ansible.builtin.command: docker buildx rm systemd-builder
          changed_when: true

        - name: Docker | Multi-Arch (Service) | Create multiarch remote buildx builder context
          ansible.builtin.command: >
            docker buildx create --name systemd-builder
            --driver remote
            --platform linux/amd64,linux/arm64
            unix:///run/buildkit/buildkitd.sock
            --use
          register: create_builder
          changed_when: true

        - name: Docker | Multi-Arch (Service) | Bootstrap and validate the new buildx context
          ansible.builtin.command: docker buildx inspect --bootstrap
          register: bootstrap_output
          changed_when: false

        - name: Docker | Multi-Arch (Service) | Fail if arm64 is missing from verified platforms list
          ansible.builtin.fail:
            msg: "BuildKit failed to bootstrap with arm64 support! Current output: {{ bootstrap_output.stdout }}"
          when: "'linux/arm64*' not in bootstrap_output.stdout"

        - name: Docker | Multi-Arch (Service) | Ensure systemd-builder is selected as active default
          ansible.builtin.command:
            cmd: docker buildx use systemd-builder
          changed_when: false

    # =========================================================================
    # APPROACH B: Isolated Docker-Container Fallback
    # =========================================================================
    - name: Docker | Multi-Arch | Setup Container Driver Approach
      when: bootstrap_docker__multiarch_builder_driver == "container"
      block:
        - name: Docker | Multi-Arch (Container) | Stop and disable host service if running
          ansible.builtin.systemd:
            name: buildkit
            state: stopped
            enabled: false
          failed_when: false

        - name: Docker | Multi-Arch (Container) | Check existing buildx builders
          ansible.builtin.command:
            cmd: docker buildx ls
          register: __docker_builders
          changed_when: false

        - name: Docker | Multi-Arch (Container) | Clean systemd builder if shifting patterns
          when: "'systemd-builder' in __docker_builders.stdout"
          ansible.builtin.command:
            cmd: docker buildx rm systemd-builder
          changed_when: true

        - name: Docker | Multi-Arch (Container) | Determine if builder must be reconstructed
          ansible.builtin.set_fact:
            __reconstruct_builder: >-
              {{
                ('multiarch-builder' not in __docker_builders.stdout) or
                __buildkit_toml_generated.changed or
                __buildx_certs_copied.changed
              }}

        - name: Docker | Multi-Arch (Container) | Tear down stale/unconfigured builder context
          when:
            - __reconstruct_builder | bool
            - "'multiarch-builder' in __docker_builders.stdout"
          ansible.builtin.command:
            cmd: docker buildx rm multiarch-builder
          changed_when: true

        - name: Docker | Multi-Arch (Container) | Reconstruct builder with explicit config and certificate volume mounts
          when: __reconstruct_builder | bool
          ansible.builtin.command:
            cmd: >
              docker buildx create
              --name multiarch-builder
              --driver docker-container
              --buildkitd-config /etc/docker/buildx/buildkitd.toml
              --use
          changed_when: true

        - name: Docker | Multi-Arch (Container) | Ensure multiarch-builder is selected as default
          ansible.builtin.command:
            cmd: docker buildx use multiarch-builder
          changed_when: false

        - name: Docker | Multi-Arch (Container) | Bootstrap/Start the buildx builder instance
          ansible.builtin.command:
            cmd: docker buildx inspect --bootstrap
          register: __builder_inspect
          changed_when: "'running' not in __builder_inspect.stdout"
