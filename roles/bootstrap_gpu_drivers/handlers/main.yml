---
- name: apt update
  ansible.builtin.apt:
    update_cache: true

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart nvidia-power-limit
  ansible.builtin.systemd:
    name: nvidia-power-limit
    state: restarted

- name: Restart docker for nvidia-cdi
  # Triggered after CDI regeneration so containers pick up the new library mounts
  ansible.builtin.systemd:
    name: docker
    state: restarted
  when: bootstrap_gpu_drivers__restart_docker | default(false) | bool
  listen: Restart docker for nvidia-cdi
