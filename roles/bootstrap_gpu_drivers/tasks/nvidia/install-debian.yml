---
- name: Enable contrib + non-free repositories (Debian)
  when: bootstrap_gpu_drivers__nvidia_debian_use_nonfree | default(false) | bool
  ansible.builtin.deb822_repository:
    name: debian-nonfree
    types: deb
    uris: http://deb.debian.org/debian
    suites: "{{ _debian_codename }}"
    components:
      - main
      - contrib
      - non-free
      - non-free-firmware
    state: present

- name: Install NVIDIA drivers (Debian way)
  ansible.builtin.apt:
    name:
      - nvidia-driver
      - nvtop
      - firmware-misc-nonfree
    state: "{{ bootstrap_gpu_drivers__package_state }}"
    update_cache: true
  register: __install_driver
