---
# NVIDIA Container Toolkit installation + CDI management
# Ensures CDI specification is regenerated after driver or toolkit changes
# (fixes stale libnvidia-egl-wayland / library mount errors after driver updates)

- name: NVIDIA Container Toolkit | DGX OS specific handling
  when: __bootstrap_gpu_drivers__is_dgx | bool
  block:
    - name: NVIDIA Container Toolkit | Ensure nvidia-container-toolkit is installed on DGX
      ansible.builtin.package:
        name: nvidia-container-toolkit
        state: present
      register: __toolkit_result

    - name: NVIDIA Container Toolkit | Configure runtime on DGX
      when: __toolkit_result.changed  # noqa: no-handler
      ansible.builtin.command: nvidia-ctk runtime configure --runtime=docker --set-as-default
      changed_when: true

- name: NVIDIA Container Toolkit | Install prerequisites
  ansible.builtin.package:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: NVIDIA Container Toolkit | Download GPG key
  ansible.builtin.get_url:
    url: https://nvidia.github.io/libnvidia-container/gpgkey
    dest: /tmp/nvidia-container-toolkit.gpg.asc
    mode: '0644'
  register: gpg_download

#- name: NVIDIA Container Toolkit | Convert GPG key to binary format
#  when: gpg_download.changed # noqa: no-handler
#  ansible.builtin.command: gpg --dearmor
#  args:
#    stdin: "{{ lookup('ansible.builtin.file', '/tmp/nvidia-container-toolkit.gpg.asc') }}"
#    creates: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
#  changed_when: false
#  register: gpg_dearmor
#
#- name: NVIDIA Container Toolkit | Install GPG keyring
#  when: gpg_dearmor.changed or gpg_download.changed
#  ansible.builtin.copy:
#    src: /tmp/nvidia-container-toolkit.gpg.asc   # wait, no: we need the dearmored one
#    dest: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
#    mode: '0644'
#    remote_src: true

- name: NVIDIA Container Toolkit | Check if keyring already exists
  ansible.builtin.stat:
    path: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
  register: keyring_stat

- name: NVIDIA Container Toolkit | Dearmor GPG key to binary format
  when: >
    gpg_download.changed or
    not keyring_stat.stat.exists
  ansible.builtin.shell: >
    gpg --dearmor < /tmp/nvidia-container-toolkit.gpg.asc
    > /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
  args:
    creates: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
  changed_when: true

- name: NVIDIA Container Toolkit | Set permissions on keyring
  ansible.builtin.file:
    path: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
    mode: '0644'
    owner: root
    group: root

- name: NVIDIA Container Toolkit | Clean up temporary GPG file
  when: gpg_download.changed  # noqa: no-handler
  ansible.builtin.file:
    path: /tmp/nvidia-container-toolkit.gpg.asc
    state: absent

- name: NVIDIA Container Toolkit | Remove legacy .list repository file
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/nvidia-container-toolkit.list
    - /etc/apt/sources.list.d/nvidia-container-toolkit.sources
  when: ansible_facts['pkg_mgr'] == 'apt'

- name: NVIDIA Container Toolkit | Add repository (deb822 format)
  when: ansible_facts['pkg_mgr'] == 'apt'
  ansible.builtin.deb822_repository:
    name: nvidia-container-toolkit
    types: deb
    uris: >-
      https://nvidia.github.io/libnvidia-container/stable/deb/{{ ansible_facts['architecture']
        | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}
    suites: /
    signed_by: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
    state: present
  register: repo_added

- name: NVIDIA Container Toolkit | Update apt cache after repo change
  when:
    - ansible_facts['pkg_mgr'] == 'apt'
    - repo_added is changed
  ansible.builtin.apt:
    update_cache: true

- name: NVIDIA Container Toolkit | Install package
  ansible.builtin.package:
    name: "nvidia-container-toolkit{{
      '=' + bootstrap_gpu_drivers__nvidia_container_toolkit_version
        if bootstrap_gpu_drivers__nvidia_container_toolkit_version else '' }}"
    state: present
  register: __toolkit_installed

# ---------------------------------------------------------------------------
# CDI + runtime configuration
# Always ensure CDI is current. Stale CDI after driver / egl-wayland updates
# causes: "failed to fulfil mount request: open .../libnvidia-egl-wayland.so..."
# ---------------------------------------------------------------------------
- name: NVIDIA Container Toolkit | Configure Docker runtime and CDI
  block:
    - name: NVIDIA Container Toolkit | Run nvidia-ctk configure (adds nvidia to daemon.json)
      ansible.builtin.command: nvidia-ctk runtime configure --runtime=docker
      register: __ctk_runtime_configure
      changed_when: "'already' not in __ctk_runtime_configure.stdout | default('') | lower"
      failed_when: false

    - name: NVIDIA Container Toolkit | Prefer CDI mode (modern path)
      ansible.builtin.command: >
        nvidia-ctk config --in-place --set nvidia-container-runtime.mode=cdi
      register: __ctk_set_cdi_mode
      changed_when: __ctk_set_cdi_mode.rc == 0
      failed_when: false

    - name: NVIDIA Container Toolkit | Generate / refresh CDI specification
      # Always regenerate. nvidia-ctk cdi generate is idempotent and cheap.
      # This is the critical fix for stale library paths after driver updates.
      ansible.builtin.command: nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
      register: __cdi_generate
      changed_when: true
      notify: Restart docker for nvidia-cdi

    - name: NVIDIA Container Toolkit | Ensure CDI directory permissions
      ansible.builtin.file:
        path: /etc/cdi
        state: directory
        mode: '0755'
        owner: root
        group: root

    - name: NVIDIA Container Toolkit | Enable and start CDI refresh service (if present)
      ansible.builtin.systemd:
        name: nvidia-cdi-refresh.service
        enabled: true
        state: started
        daemon_reload: true
      failed_when: false  # service may not exist on older toolkit versions

    - name: NVIDIA Container Toolkit | Restart Docker to apply runtime / CDI changes
      when: >
        bootstrap_gpu_drivers__restart_docker | bool
        or __toolkit_installed.changed
        or repo_added.changed
        or __cdi_generate is defined
      ansible.builtin.systemd:
        name: docker
        state: restarted
      failed_when: false
