---

- name: Unload nouveau # noqa: ignore-errors
  community.general.modprobe:
    name: nouveau
    state: absent
  ignore_errors: true

- name: Ubuntu install tasks (canonical repos)
  when:
    - ansible_facts['distribution'] == 'Ubuntu'
    - not bootstrap_gpu_drivers__nvidia_ubuntu_install_from_cuda_repo
  ansible.builtin.include_tasks: nvidia/install-ubuntu.yml

- name: Debian NVIDIA tasks
  when: ansible_facts.os_family == 'Debian' and ansible_facts.distribution != 'Ubuntu'
  ansible.builtin.include_tasks: nvidia/install-debian.yml

- name: Ubuntu install tasks (CUDA repo)
  when:
    - ansible_facts['distribution'] == 'Ubuntu'
    - bootstrap_gpu_drivers__nvidia_ubuntu_install_from_cuda_repo
  ansible.builtin.include_tasks: nvidia/install-ubuntu-cuda-repo.yml

- name: Redhat family install tasks
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.include_tasks: nvidia/install-redhat.yml

- name: Create persistenced override dir
  ansible.builtin.file:
    path: /etc/systemd/system/nvidia-persistenced.service.d/
    state: directory
    recurse: true

- name: Configure persistenced service to turn on persistence mode
  when: bootstrap_gpu_drivers__persistence_mode_on
  ansible.builtin.copy:
    src: nvidia-persistenced-override.conf
    dest: /etc/systemd/system/nvidia-persistenced.service.d/override.conf
    mode: "0644"

- name: Remove persistenced service override
  when: not bootstrap_gpu_drivers__persistence_mode_on
  ansible.builtin.file:
    path: /etc/systemd/system/nvidia-persistenced.service.d/override.conf
    state: absent

- name: Enable persistenced
  when: bootstrap_gpu_drivers__package_state != 'absent'
  ansible.builtin.systemd:
    name: nvidia-persistenced
    enabled: true

- name: Set module parameters
  when: bootstrap_gpu_drivers__nvidia_module_params | d('') | length > 0
  ansible.builtin.template:
    src: nvidia.conf.j2
    dest: "{{ bootstrap_gpu_drivers__nvidia_module_file }}"
    mode: "0644"

# === Post-install verification ===
- name: Verify NVIDIA driver
  when: __bootstrap_gpu_drivers__enable_nvidia | bool
  ansible.builtin.command: nvidia-smi
  register: __verify_nvidia_result
  failed_when: false
  changed_when: false

- name: Check active driver version
  when:
    - __bootstrap_gpu_drivers__enable_nvidia | bool
    - __verify_nvidia_result.rc != 0
  ansible.builtin.command: grep -i "NVRM version" /proc/driver/nvidia/version
  register: __nvidia_proc_version
  failed_when: false
  changed_when: false

- name: Check kernel module version
  when:
    - __bootstrap_gpu_drivers__enable_nvidia | bool
    - __verify_nvidia_result.rc != 0
  ansible.builtin.shell: modinfo nvidia | grep -E "^version:"
  register: __nvidia_modinfo_version
  failed_when: false
  changed_when: false

- name: Fail gracefully with concise diagnostics on NVIDIA version mismatch
  when:
    - __bootstrap_gpu_drivers__enable_nvidia | bool
    - __verify_nvidia_result.rc != 0
  ansible.builtin.fail:
    msg: |
      [ERROR]: 'nvidia-smi' failed on {{ inventory_hostname }} with return code {{ __verify_nvidia_result.rc }}.
      Driver/library version mismatch detected (pending reboot required).

      Diagnostics comparison:
      - Active Version (/proc): {{ __nvidia_proc_version.stdout | default('N/A') }}
      - Module Version (modinfo): {{ __nvidia_modinfo_version.stdout | default('N/A') }}

      Reboot the host to synchronize.

- name: Reboot after driver install
  when:
    - __install_driver.changed
    - not bootstrap_gpu_drivers__skip_reboot
  ansible.builtin.reboot:
