---

- name: "Display __bootstrap_ansible_controller__controller_host"
  ansible.builtin.debug:
    var: __bootstrap_ansible_controller__controller_host

- name: "Display bootstrap_ansible_controller__controller_env"
  ansible.builtin.debug:
    var: bootstrap_ansible_controller__controller_env

- name: "Display __bootstrap_ansible_controller__controller_oauth_token"
  ansible.builtin.debug:
    var: __bootstrap_ansible_controller__controller_oauth_token
    verbosity: 1

- name: "Display __bootstrap_ansible_controller__controller_verify_ssl"
  ansible.builtin.debug:
    var: __bootstrap_ansible_controller__controller_verify_ssl

- name: "Include all vars files"
  ansible.builtin.include_vars:
    dir: vars/
    ignore_files: vaulted-credentials.yml
    ignore_unknown_extensions: true
    extensions: ['yml', 'yaml', 'json']

- name: "Include secure credentials" # Used to set __vaulted_credentials fact as either masked or unmasked
  ansible.builtin.include_vars:
    file: vars/vaulted-credentials.yml
  no_log: true

- name: "Initialize __vaulted_credentials_raw"
  ansible.builtin.set_fact:
    __vaulted_credentials_raw: "{{ bootstrap_ansible_controller__vaulted_credentials
      | d(bootstrap_ansible_controller__vaulted_credentials_default, true) }}"

- name: "Mask credentials"
  ansible.builtin.set_fact:
    __vaulted_credentials: "{{ __vaulted_credentials | d({}, true) | combine(({item: 'MASKED'})) }}"
  loop: "{{ __vaulted_credentials_raw.keys() | list }}"

# - name: "Display controller organizations action"
#   ansible.builtin.debug:
#     var: bootstrap_ansible_controller__state

- name: "Set __role_var_prefix"
  ansible.builtin.set_fact:
    __role_var_prefix: "{{ role_name | replace('-','_') }}"

- name: "Set {{ __role_var_prefix }} list var prefixes"
  ansible.builtin.set_fact:
#    __role_credentials_var_prefix: "{{ __role_var_prefix }}_credentials__"
    __role_projects_var_prefix: "{{ __role_var_prefix }}_projects__"
    __role_inventories_var_prefix: "{{ __role_var_prefix }}_inventories__"
    __role_job_templates_var_prefix: "{{ __role_var_prefix }}_job_templates__"
    __role_workflow_templates_var_prefix: "{{ __role_var_prefix }}_workflow_templates__"
    __role_schedules_var_prefix: "{{ __role_var_prefix }}_schedules__"

- name: "Set {{ __role_var_prefix }} var regex's"
  ansible.builtin.set_fact:
#    __role_credentials_list_var_regex: "^{{ __role_credentials_var_prefix }}"
    __role_projects_list_var_regex: "^{{ __role_projects_var_prefix }}"
    __role_inventories_list_var_regex: "^{{ __role_inventories_var_prefix }}"
    __role_job_templates_list_var_regex: "^{{ __role_job_templates_var_prefix }}"
    __role_workflow_templates_list_var_regex: "^{{ __role_workflow_templates_var_prefix }}"
    __role_schedules_list_var_regex: "^{{ __role_schedules_var_prefix }}"

- name: "Initialize {{ __role_var_prefix }} lists"
  ansible.builtin.set_fact:
    __controller_env_specific_vars: " {{ bootstrap_ansible_controller__env_specific_vars
      | d(bootstrap_ansible_controller__env_specific_vars_default, true) }}"
    __controller_general_settings: " {{ bootstrap_ansible_controller__general_settings
      | d(bootstrap_ansible_controller__general_settings_default, true) }}"
    __controller_saml_settings: " {{ bootstrap_ansible_controller__saml_settings
      | d(bootstrap_ansible_controller__saml_settings_default, true) }}"
    __controller_organizations: "{{ bootstrap_ansible_controller__organizations
      | d(bootstrap_ansible_controller__organizations_default, true) }}"
    __controller_credential_types: "{{ bootstrap_ansible_controller__credential_types
      | d(bootstrap_ansible_controller__credential_types_default, true) }}"
    __controller_credentials: "{{ bootstrap_ansible_controller__credentials
      | d(bootstrap_ansible_controller__credentials_default, true) }}"
    __controller_local_users: "{{ bootstrap_ansible_controller__local_users
      | d(bootstrap_ansible_controller__local_users_default, true) }}"
    __controller_execution_environments: "{{ bootstrap_ansible_controller__execution_environments
      | d(bootstrap_ansible_controller__execution_environments_default, true) }}"
    __controller_notification_templates: "{{ bootstrap_ansible_controller__notification_templates
      | d(bootstrap_ansible_controller__notification_templates_default, true) }}"
    __controller_projects: "{{ bootstrap_ansible_controller__projects
      | d(bootstrap_ansible_controller__projects_default, true) }}"
    __controller_inventories: "{{ bootstrap_ansible_controller__inventories
      | d(bootstrap_ansible_controller__inventories_default, true) }}"
    __controller_job_templates: "{{ bootstrap_ansible_controller__job_templates
      | d(bootstrap_ansible_controller__job_templates_default, true) }}"
    __controller_workflow_templates: "{{ bootstrap_ansible_controller__workflow_templates
      | d(bootstrap_ansible_controller__workflow_templates_default, true) }}"
    __controller_schedules: "{{ bootstrap_ansible_controller__schedules | d(bootstrap_ansible_controller__schedules_default, true) }}"

# __org_team_list is a list of dictionary items with an entry for each org/team combination. e.g.:
#
# __org_team_list:
#   - organization: example
#     team: SG - Ansible-Admin
#   - organization: example
#     team: SG - Ansible-Midwa
#   - organization: FakeOrg
#     team: SG - Ansible-Admin

- name: "Initialize {{ __role_var_prefix }} Set __org_team_list"
  ansible.builtin.set_fact:
    __org_team_list: |-
        {% set ns = namespace() %}
        {% for org in __controller_organizations %}
        {% set ns.combined_list = ns.combined_list | d([], true) + [org['name']] | product(org['teams']) | list %}
        {% for each in ns.combined_list %}
        {% set ns.list_of_dicts = ns.list_of_dicts | d([], true) + [{'organization': each[0], 'team': each[1]}] %}
        {% endfor %}
        {% endfor %}
        {{ ns.list_of_dicts }}

