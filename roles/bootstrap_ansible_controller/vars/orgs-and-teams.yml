---
bootstrap_ansible_controller__organizations_default:
  - name: example
    description: Example
    teams:
      - SG - Ansible-Admin
      - SG - Ansible-BIDE
      - SG - Ansible-BIDT
      - SG - Ansible-ClientServices
      - SG - Ansible-Database
      - SG - Ansible-DCC
      - SG - Ansible-Digital
      - SG - Ansible-DWP
      - SG - Ansible-East
      - SG - Ansible-Infosec
      - SG - Ansible-Infrasec
      - SG - Ansible-Linux
      - SG - Ansible-Midwa
      - SG - Ansible-Network
      - SG - Ansible-Openshift
      - SG - Ansible-Rely
      - SG - Ansible-TRP
      - SG - Ansible-Windows
      - SG - Ansible-BIRT
    auditors:
      - SG - Ansible-Infrasec
    admin_roles:
      project_admin: "{{ __controller_env_specific_vars[bootstrap_ansible_controller__controller_env]['development_groups'] }}"
      inventory_admin: "{{ __controller_env_specific_vars[bootstrap_ansible_controller__controller_env]['development_groups'] }}"
      job_template_admin: "{{ __controller_env_specific_vars[bootstrap_ansible_controller__controller_env]['development_groups'] }}"
      credential_admin:
        - SG - Ansible-Admin
      workflow_admin:
        - SG - Ansible-Admin
      notification_admin:
        - SG - Ansible-Admin
      execution_environment_admin:
        - SG - Ansible-Admin
    galaxy_credentials: "{{ __controller_env_specific_vars[bootstrap_ansible_controller__controller_env]['galaxy_creds'] }}"
