  ## DCC TEST templates
  #################
  - name: "DCC TEST PLAYBOOKS - test-connectivity"
    description: Connectivity Test Playbook (runs example.utils.ping_test only) - test-connectivity mte:5
    organization: example
    inventory: "example inventory - {{ __scm_branch_abbrev__infra1101 }}"
    project: AAP common
    playbook: tests/test-connectivity.yml
    scm_branch: "{{ __scm_branch__infra1101 }}"
    credentials:
      - AAP - Vault
    ask_limit_on_launch: true
    ask_variables_on_launch: false
    ask_verbosity_on_launch: true
    become_enabled: true
    roles:
      admin:
      execute:

  #################
  ## example.utils COLLECTION MODULE TEST templates
  #################
