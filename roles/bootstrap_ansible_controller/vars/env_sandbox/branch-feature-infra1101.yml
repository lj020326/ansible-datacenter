---

__scm_branch_abbrev__infra1101: "feature/INFRA-1101"
__scm_branch__infra1101: "feature/INFRA-1101-example.git_inventory-module-enhancements"

#############
## Branch project config
#############
bootstrap_ansible_controller__projects__branch_infra1101:

  - name: "example inventory - {{ __scm_branch_abbrev__infra1101 }}"
    description:
    organization: example
    scm_type: git
    scm_branch: "{{ __scm_branch__infra1101 }}"
    scm_url: ssh://git@gitea.admin.example.int:2222/infra/aap-inventory.git
    credential: example - Ansible - git
    default_environment: Automation Hub Default execution environment
    scm_update_on_launch: true
    scm_clean: true
    roles:
      admin:
      use:
      update:
    environments: "{{ __bootstrap_ansible_controller__test_environments }}"

  - name: "AAP common - {{ __scm_branch_abbrev__infra1101 }}"
    description: aap_common repository
    organization: example
    scm_type: git
    scm_branch: "{{ __scm_branch__infra1101 }}"
    scm_url: ssh://git@gitea.admin.example.int:2222/infra/aap-common.git
    credential: "{{ bootstrap_ansible_controller__default_git_credential }}"
    default_environment: Automation Hub Ansible Engine 2.9 execution environment
    scm_update_on_launch: true
    scm_clean: true
    allow_override: "{{ __allow_scm_branch_override }}"
    roles:
      admin:
      use:

#############
## Branch inventory config
#############
bootstrap_ansible_controller__inventories__branch_infra1101:

  - name: "example inventory - {{ __scm_branch_abbrev__infra1101 }}"
    description:
    organization: example
    sources:
      - name: Bitbucket
        description: Inventory from repository
        update_on_launch: true
        source: scm
        source_project: "example inventory - {{ __scm_branch_abbrev__infra1101 }}"
        source_path: "{{ __controller_env_specific_vars[bootstrap_ansible_controller__controller_env]['inventory_source_path'] }}"
        overwrite: true
        overwrite_vars: true
    roles:
      use:
        - SG - Ansible-Admin
        - SG - Ansible-BIDE
        - SG - Ansible-ClientServices
        - SG - Ansible-Database
        - SG - Ansible-Digital
        - SG - Ansible-DWP
        - SG - Ansible-East
        - SG - Ansible-Linux
        - SG - Ansible-Midwa
        - SG - Ansible-Network
        - SG - Ansible-Openshift
        - SG - Ansible-Rely
        - SG - Ansible-TRP
        - SG - Ansible-Windows
    environments: "{{ __bootstrap_ansible_controller__test_environments }}"

