---
# Runtime target: 'docker', 'swarm', or 'native'
run_vllm_benchmark_tests__runtime: "native"

# Container and Service Identifiers
run_vllm_benchmark_tests__docker_stack_name: "llm"
run_vllm_benchmark_tests__service_name: "vllm-execution"
run_vllm_benchmark_tests__container_name: "vllm-execution"
run_vllm_benchmark_tests__container_data_dir: "/data"

# Engine Access Configurations
#run_vllm_benchmark_tests__model_name: "meta-llama/Meta-Llama-3.1-8B-Instruct"
#run_vllm_benchmark_tests__model_name: "nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4"
run_vllm_benchmark_tests__model_name: "nemotron-lightning"
run_vllm_benchmark_tests__tokenizer: "nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4"

run_vllm_benchmark_tests__base_url: "http://localhost:8000"
run_vllm_benchmark_tests__endpoint: "/v1/chat/completions"
run_vllm_benchmark_tests__api_key: ""  # Set if VLLM_API_KEY authentication is enforced

# Output Paths
run_vllm_benchmark_tests__remote_results_dir: "/tmp/vllm_benchmark_results"
run_vllm_benchmark_tests__fetch_results: false
run_vllm_benchmark_tests__local_results_dir: "{{ playbook_dir }}/benchmark_results/{{ inventory_hostname }}"

# Benchmark Scenarios
# Workload profile settings for coding (continuous generation) vs reasoning (context & CoT)
run_vllm_benchmark_tests__profiles:
  coding_burst:
    dataset_name: "random"
    num_prompts: 100
    random_input_len: 512
    random_output_len: 2048
    request_rate: "inf"
    max_concurrency: 64
  coding_qps5:
    dataset_name: "random"
    num_prompts: 100
    random_input_len: 512
    random_output_len: 2048
    request_rate: "5"
    max_concurrency: 32
  reasoning_burst:
    dataset_name: "random"
    num_prompts: 50
    random_input_len: 2048
    random_output_len: 4096
    request_rate: "inf"
    max_concurrency: 32
  reasoning_qps2:
    dataset_name: "random"
    num_prompts: 50
    random_input_len: 2048
    random_output_len: 4096
    request_rate: "2"
    max_concurrency: 16
