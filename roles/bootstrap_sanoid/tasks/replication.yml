---
- name: setup cron job for replication
  ansible.builtin.cron:
    user: root
    job: "{{ item.job }}"
    name: "{{ item.name }}"
    weekday: "{{ item.weekday| default('*') }}"
    minute: "{{ item.minute| d('00', true) }}"
    hour: "{{ item.hour| d('00', true) }}"
    dom: "{{ item.dom | d('*') }}"
  with_items:
    - "{{ syncoid_cron_jobs }}"
