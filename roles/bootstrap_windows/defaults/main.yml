---

# NTP servers
bootstrap_windows__ntp_servers:
  - 0.centos.pool.ntp.org
  - 1.centos.pool.ntp.org
  - 2.centos.pool.ntp.org

# Allow reboots when Windows Updates are installed
bootstrap_windows__allow_windows_reboot_during_win_updates: true

bootstrap_windows__ansible_user: ansible

bootstrap_windows__ssh_pub_authorized_key: "{{ lookup('file', '~/.ssh/id_rsa.pub' | expanduser) }}"

bootstrap_windows__install_windows_updates: false
bootstrap_windows__install_virtio_drivers: false
bootstrap_windows__install_vdagent: false

bootstrap_windows__bleachbit_url: https://download.bleachbit.org/BleachBit-4.4.2-portable.zip
bootstrap_windows__openssh_url: https://github.com/PowerShell/Win32-OpenSSH/releases/download/V8.6.0.0p1-Beta/OpenSSH-Win64.zip

bootstrap_windows__ultradefrag_version: 7.1.4
bootstrap_windows__ultradefrag_msi_file_name: ultradefrag-portable-{{bootstrap_windows__ultradefrag_version}}.bin.amd64.zip
bootstrap_windows__ultradefrag_download_url: https://archiva.example.int/repository//ultradefrag-portable/{{
    bootstrap_windows__ultradefrag_version }}.bin.amd64/{{ bootstrap_windows__ultradefrag_msi_file_name}}
#bootstrap_windows__ultradefrag_download_url: https://altushost-swe.dl.sourceforge.net/project/ultradefrag/stable-release/{{ bootstrap_windows__ultradefrag_version }}/ultradefrag-portable-{{ bootstrap_windows__ultradefrag_version }}.bin.amd64.zip

# Find the available versions here https://www.spice-space.org/download/windows/vdagent/
bootstrap_windows__vdagent_win_version: 0.10.0

# URL of the virtio-win.iso
bootstrap_windows__virtio_win_iso_url: https://fedorapeople.org/groups/virt/virtio-win/direct-downloads/latest-virtio/virtio-win.iso

## Path where the are the files/directories from virtio-win.iso (usually CD-ROM). If this is set, then the virtio-win.iso is going to be downloaded.
# bootstrap_windows__virtio_win_iso_path: E:\\
bootstrap_windows__virtio_win_iso_path: E:\\virtio-win\\

bootstrap_windows__putty_regedit:
  path: HKCU:\SOFTWARE\SimonTatham\PuTTY\Sessions\Default%20Settings
  configs:
    - name: TCPKeepalives
      data: 1
      type: dword
    - name: PingIntervalSecs
      data: 30
      type: dword
    - name: Compression
      data: 1
    - name: AgentFwd
      data: 1
    - name: LinuxFunctionKeys
      data: 1
    - name: MouseIsXterm
      data: 1
    - name: ConnectionSharing
      data: 1

bootstrap_windows__install_vdagent_url: https://www.spice-space.org/download/windows/vdagent/vdagent-win-{{ bootstrap_windows__vdagent_win_version }}/vdagent-win-{{
  bootstrap_windows__vdagent_win_version }}-x64.zip
