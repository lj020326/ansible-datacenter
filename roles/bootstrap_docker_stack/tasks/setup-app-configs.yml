---
- name: "Setup app PRE-SETUP configs defined in tasks/apps/[__container_service_name]/pre-setup.yml"
  when: (role_path + '/tasks/apps/' + (__container_service_name | replace('-','_')) + '/pre-setup.yml') is file
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/apps/{{ __container_service_name }}/pre-setup.yml"
  loop: "{{ __docker_stack__app_services }}"
  loop_control:
    loop_var: __container_service_name

- name: "{{ __docker_stack__log_prefix__app_config }} Display __docker_stack__app_config_dirs"
  when: __docker_stack__app_config_dirs | length > 0
  ansible.builtin.debug:
    var: __docker_stack__app_config_dirs
    verbosity: 1

- name: "{{ __docker_stack__log_prefix__app_config }} Ensure docker dirs exist"
  ansible.builtin.file:
    state: directory
    path: "{{ item.path }}"
    owner: "{{ item.owner | d(docker_stack__user_username) }}"
    group: "{{ item.group | d(docker_stack__user_group) }}"
    mode: "{{ item.mode | d('0755') }}"
    recurse: "{{ item.recurse | d(omit) }}"
  loop: "{{ __docker_stack__app_config_dirs }}"

- name: "{{ __docker_stack__log_prefix__app_config }} Display __docker_stack__app_config_templates"
  ansible.builtin.debug:
    var: __docker_stack__app_config_templates
    verbosity: 1

- name: "{{ __docker_stack__log_prefix__app_config }} Install docker stack app config template"
  ansible.builtin.template:
    backup: "{{ item.backup | d(true) | bool }}"
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    force: "{{ item.force | d(omit) }}"
    mode: "{{ item.mode | d('0664') }}"
    owner: "{{ docker_stack__user_username }}"
    group: "{{ docker_stack__user_group }}"
  loop: "{{ __docker_stack__app_config_templates }}"

- name: "{{ __docker_stack__log_prefix__app_config }} Display __docker_stack__app_config_files"
  ansible.builtin.debug:
    var: __docker_stack__app_config_files
    verbosity: 1

- name: "{{ __docker_stack__log_prefix__app_config }} Copy docker stack app config files"
  ansible.builtin.copy:
    backup: "{{ item.backup | d(true) | bool }}"
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ docker_stack__user_username }}"
    group: "{{ docker_stack__user_group }}"
    force: "{{ item.force | d(omit) }}"
    remote_src: "{{ item.remote_src | d(omit) }}"
    mode: "{{ item.mode | d('0664') }}"
  loop: "{{ __docker_stack__app_config_files }}"
