---
- name: "{{ __docker_stack__log_prefix__app_config }} Configure htpasswd users file"
  when: docker_stack__basic_auth_users | d([]) | length > 0
  block:
    - name: "{{ __docker_stack__log_prefix__app_config }} Install python module passlib required for htpasswd password hashing"
      ansible.builtin.pip:
        name: passlib
        state: present

    - name: "{{ __docker_stack__log_prefix__app_config }} Display docker_stack__basic_auth_users info"
      ansible.builtin.debug:
        msg:
          - "username: {{ item.username }}"
          - "password length: {{ item.password | length }}"
        verbosity: 1
      loop: "{{ docker_stack__basic_auth_users }}"
      loop_control:
        label: "{{ item.username }}"

    - name: "{{ __docker_stack__log_prefix__app_config }} Populate valid htpasswd users"
      no_log: true
      dettonville.utils.htpasswd:
        path: "{{ docker_stack__dir }}/shared/.htpasswd"
        user_list: "{{ docker_stack__basic_auth_users }}"
        owner: "{{ docker_stack__user_username }}"
        group: "{{ docker_stack__user_group }}"
        mode: "0600"
        crypt_scheme: bcrypt
        overwrite: true
        backup: true

    - name: "{{ __docker_stack__log_prefix__app_config }} Load htpasswd data"
      no_log: true
      ansible.builtin.slurp:
        src: "{{ docker_stack__dir }}/shared/.htpasswd"
      register: __slurp_htpasswd

- name: "{{ __docker_stack__log_prefix__app_config }} Display __docker_stack__app_config_dirs"
  when: __docker_stack__app_config_dirs | length > 0
  ansible.builtin.debug:
    var: __docker_stack__app_config_dirs
    verbosity: 1

- name: "{{ __docker_stack__log_prefix__app_config }} Ensure docker dirs exist"
  ansible.builtin.file:
    state: directory
    path: "{{ item.path }}"
    owner: "{{ item.owner | d(docker_stack__user_username) }}"
    group: "{{ item.group | d(docker_stack__user_group) }}"
    mode: "{{ item.mode | d('0755') }}"
    recurse: "{{ item.recurse | d(omit) }}"
  loop: "{{ __docker_stack__app_config_dirs }}"

- name: "{{ __docker_stack__log_prefix__app_config }} Ensure docker stack proxy service templates"
  when: __docker_stack__proxy_services | length > 0
  block:
    - name: "{{ __docker_stack__log_prefix__app_config }} Display __docker_stack__proxy_service_configs"
      ansible.builtin.debug:
        var: __docker_stack__proxy_service_configs

    - name: "{{ __docker_stack__log_prefix__app_config }} Install docker stack proxy service templates"
      ansible.builtin.template:
        backup: true
        src: traefik/rules/proxy-services.yml.j2
        dest: "{{ __docker_stack__traefik__dir }}/rules/proxy-services.yml"
        mode: "0664"
        owner: "{{ docker_stack__user_username }}"
        group: "{{ docker_stack__user_group }}"

- name: "{{ __docker_stack__log_prefix__app_config }} Display __docker_stack__app_config_templates"
  ansible.builtin.debug:
    var: __docker_stack__app_config_templates
    verbosity: 1

- name: "{{ __docker_stack__log_prefix__app_config }} Install docker stack app config template"
  ansible.builtin.template:
    backup: "{{ item.backup | d(true) | bool }}"
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    force: "{{ item.force | d(omit) }}"
    mode: "{{ item.mode | d('0664') }}"
    owner: "{{ docker_stack__user_username }}"
    group: "{{ docker_stack__user_group }}"
  loop: "{{ __docker_stack__app_config_templates }}"

- name: "{{ __docker_stack__log_prefix__app_config }} Display __docker_stack__app_config_files"
  ansible.builtin.debug:
    var: __docker_stack__app_config_files
    verbosity: 1

- name: "{{ __docker_stack__log_prefix__app_config }} Copy docker stack app config files"
  ansible.builtin.copy:
    backup: "{{ item.backup | d(true) | bool }}"
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ docker_stack__user_username }}"
    group: "{{ docker_stack__user_group }}"
    force: "{{ item.force | d(omit) }}"
    remote_src: "{{ item.remote_src | d(omit) }}"
    mode: "{{ item.mode | d('0664') }}"
  loop: "{{ __docker_stack__app_config_files }}"
