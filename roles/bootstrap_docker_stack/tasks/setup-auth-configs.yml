---
- name: "{{ __docker_stack__log_prefix__app_config }} Install python module passlib required for htpasswd password hashing"
  ansible.builtin.pip:
    name: passlib
    state: present

- name: "{{ __docker_stack__log_prefix__app_config }} Display docker_stack__basic_auth_users info"
  ansible.builtin.debug:
    msg:
      - "username: {{ item.username }}"
      - "password length: {{ item.password | length }}"
    verbosity: 1
  loop: "{{ docker_stack__basic_auth_users }}"
  loop_control:
    label: "{{ item.username }}"

- name: "{{ __docker_stack__log_prefix__app_config }} Populate valid htpasswd users"
  no_log: true
  dettonville.utils.htpasswd:
    path: "{{ docker_stack__dir }}/shared/.htpasswd"
    user_list: "{{ docker_stack__basic_auth_users }}"
    owner: "{{ docker_stack__user_username }}"
    group: "{{ docker_stack__user_group }}"
    mode: "0600"
    crypt_scheme: bcrypt
    overwrite: true
    backup: true

- name: "{{ __docker_stack__log_prefix__app_config }} Load htpasswd data"
  no_log: true
  ansible.builtin.slurp:
    src: "{{ docker_stack__dir }}/shared/.htpasswd"
  register: __slurp_htpasswd
