---
- name: "Pre-start | jenkins-jcac | Set log_prefix_local"
  ansible.builtin.set_fact:
    log_prefix_local: "Jenkins pre-start |"

- name: "Pre-start | jenkins-jcac | {{ log_prefix_local }} Display __docker_stack__jenkins_jcac__package_requirements"
  ansible.builtin.debug:
    var: __docker_stack__jenkins_jcac__package_requirements

- name: "Pre-start | jenkins-jcac | {{ log_prefix_local }} Ensure jenkins package requirements"
  when: __docker_stack__jenkins_jcac__package_requirements | d([], true) | length > 0
  ansible.builtin.package:
    name: "{{ __docker_stack__jenkins_jcac__package_requirements }}"
    state: present
