---
- name: "Pre-start | registry | Set __registry_auth_file"
  ansible.builtin.set_fact:
    __registry_auth_file: "{{ __docker_stack__registry__auth_path }}/{{ __docker_stack__registry__auth_file }}"

- name: "Pre-start | registry | Check if {{ __registry_auth_file }} exists"
  ansible.builtin.stat:
    path: "{{ __registry_auth_file }}"
  register: __registry_auth_file_stat

- name: "Pre-start | registry | Display __registry_auth_file_stat.stat.exists"
  ansible.builtin.debug:
    var: __registry_auth_file_stat.stat.exists

- name: "Pre-start | registry | Setup {{ __registry_auth_file }}"
  when:
    - __docker_stack__registry__enable_auth | bool
    - __docker_stack__registry__users | d([], true) | length > 0
  block:
    - name: "Pre-start | registry | Install htpasswd deps with pip"
      ansible.builtin.pip:
        name: passlib[bcrypt]
        state: present

    - name: "Pre-start | registry | Display docker registry vars"
      ansible.builtin.debug:
        msg:
          - "__docker_stack__registry__enable_auth: {{ __docker_stack__registry__enable_auth }}"
          - "__docker_stack__registry__auth_path: {{ __docker_stack__registry__auth_path }}"
          - "__docker_stack__registry__auth_file: {{ __docker_stack__registry__auth_file }}"
          # - "__docker_stack__registry__users: {{ __docker_stack__registry__users | to_nice_json }}"
          - "__docker_stack__registry__env: {{ __docker_stack__registry__env | to_nice_json }}"

    # - name: "Pre-start | registry | Stop registry service"
    #   community.docker.docker_compose_v2:
    #     project_src: "{{ docker_stack__dir }}"
    #     services:
    #       - registry
    #     state: stopped

    #- name: "Pre-start | registry | Remove registry, if it exists"
    #  no_log: true
    #  community.docker.docker_container:
    #    name: "{{ __docker_stack__registry__container_name }}"
    #    container_default_behavior: compatibility
    #    #    container_default_behavior: no_defaults
    #    state: absent

    - name: "Pre-start | registry | Display __docker_stack__registry__users info"
      ansible.builtin.debug:
        msg:
          - "username: {{ item.username }}"
          - "password length: {{ item.password | length }}"
        verbosity: 1
      loop: "{{ __docker_stack__registry__users }}"
      loop_control:
        label: "{{ item.username }}"

    - name: "Pre-start | registry | Configure {{ __docker_stack__registry__auth_file }} users file"
      no_log: true
      dettonville.utils.htpasswd:
        path: "{{ __registry_auth_file }}"
        user_list: "{{ __docker_stack__registry__users }}"
        owner: "{{ docker_stack__user_username }}"
        group: "{{ docker_stack__user_group }}"
        mode: "0600"
        crypt_scheme: bcrypt
        overwrite: true
        backup: true
      register: __htpasswd_result

    - name: "Pre-start | registry | Restart registry service"  # noqa: no-handler
      when: __htpasswd_result is changed
      community.docker.docker_compose_v2:
        project_src: "{{ docker_stack__dir }}"
        services:
          - registry
        state: restarted
