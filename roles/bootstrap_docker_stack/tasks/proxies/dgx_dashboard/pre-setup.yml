---
- name: Docker Stack | dgx-dashboard | pre-start | Install socat
  ansible.builtin.package:
    name: socat
    state: present

- name: Docker Stack | dgx-dashboard | pre-start | Install dgx-dashboard-proxy systemd service
  ansible.builtin.template:
    src: dgx-dashboard-proxy.service.j2
    dest: /etc/systemd/system/dgx-dashboard-proxy.service
    mode: '0644'

- name: Docker Stack | dgx-dashboard | pre-start | Enable dgx-dashboard-proxy service
  ansible.builtin.systemd:
    name: dgx-dashboard-proxy.service
    enabled: true
    daemon_reload: true
