---
## ref: https://techoverflow.net/2020/10/24/create-a-systemd-service-for-your-docker-compose-project-in-10-seconds/
- name: "{{ __docker_stack__log_prefix__setup_systemd_service }} Setup systemd service for docker-compose"
  ansible.builtin.include_role:
    name: bootstrap_systemd_service
  vars:
    bootstrap_systemd_service__name: "{{
      __docker_stack__systemd_service__name }}"
    bootstrap_systemd_service__force_update: true
    bootstrap_systemd_service__envs:
      - PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
#      - PATH=$PATH:/usr/local/bin
    bootstrap_systemd_service__unit_description: "Docker Compose Service for {{
      docker_stack__dir }}"
    bootstrap_systemd_service__service_type: oneshot
    bootstrap_systemd_service__unit_requires: docker.service
    bootstrap_systemd_service__unit_wants: network.target
    bootstrap_systemd_service__unit_after: docker.service
    #    bootstrap_systemd_service__service_restart: always
    #    bootstrap_systemd_service__service_restart: on-success
    bootstrap_systemd_service__service_restart: on-failure
    bootstrap_systemd_service__service_remainafterexit: true
#    bootstrap_systemd_service__service_user: "{{ docker_stack__user_username }}"
#    bootstrap_systemd_service__service_group: "{{ docker_stack__user_username }}"
##    bootstrap_systemd_service__service_group: docker
#    bootstrap_systemd_service__service_execstartpre:
#      - docker compose down
#    bootstrap_systemd_service__service_execstart: docker compose up
#    bootstrap_systemd_service__service_execstop: docker compose down

    bootstrap_systemd_service__service_execstartpre: "{{
      docker_stack__stack_command }} -sr -f {{ docker_stack__dir }}/docker-compose.yml"
    bootstrap_systemd_service__service_execstart: "{{
      docker_stack__stack_command }} -f {{ docker_stack__dir }}/docker-compose.yml"
    bootstrap_systemd_service__service_execstop: "{{
      docker_stack__stack_command }} -sr -f {{ docker_stack__dir }}/docker-compose.yml"
    bootstrap_systemd_service__service_workingdirectory: "{{ docker_stack__dir }}"
    bootstrap_systemd_service__service_timeoutsec: "{{
      docker_stack__systemd_service_timeout_sec }}"
    bootstrap_systemd_service__install_wantedby: multi-user.target
