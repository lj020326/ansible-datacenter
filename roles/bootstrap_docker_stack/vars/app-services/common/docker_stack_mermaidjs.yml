---

__docker_stack__mermaidjs__stack_dir: "{{ docker_stack__dir | d('/home/user/docker-dirs') }}"
__docker_stack__mermaidjs__http_port: "{{ docker_stack__mermaidjs__http_port | d('18080') }}"

docker_stack__appspec__mermaidjs:
  dirs: "{{ __docker_stack__mermaidjs__config_dirs | d([], true) }}"
  files: "{{ __docker_stack__mermaidjs__config_files | d([], true) }}"
  templates: "{{ __docker_stack__mermaidjs__config_templates | d([], true) }}"
  firewalld_services: "{{ __docker_stack__mermaidjs__firewalld_services | d([], true) }}"
  firewalld_ports: "{{ __docker_stack__mermaidjs__firewalld_ports | d([], true) }}"
  docker_services: "{{ __docker_stack__mermaidjs__services | d({}, true) }}"
