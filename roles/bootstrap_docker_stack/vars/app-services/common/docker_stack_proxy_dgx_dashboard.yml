---

__docker_stack__proxyspec__dgx_dashboard_backend: "{{ docker_stack__dgx_dashboard_backend
  | d('http://host.docker.internal:11001') }}"

__docker_stack__proxyspec__dgx_dashboard:
  proxy_config: "{{ __docker_stack__dgx_dashboard__proxy_config | d({}, true) }}"

__docker_stack__dgx_dashboard__dgx_dashboard_port: "{{ docker_stack__dgx_dashboard__dgx_dashboard_port | d(11000) }}"
__docker_stack__dgx_dashboard__socat_proxy_port: "{{ docker_stack__dgx_dashboard__socat_proxy_port | d(11001) }}"
