---

__docker_stack__vllm__stack_dir: "{{ docker_stack__dir | d('/home/user/docker-dirs') }}"
__docker_stack__vllm__base_dir: "{{ __docker_stack__vllm__stack_dir }}/vllm"
__docker_stack__vllm__cache_dir: "{{ __docker_stack__vllm__base_dir }}/cache-coder"
__docker_stack__vllm__models_dir: "{{ __docker_stack__vllm__base_dir }}/models"
__docker_stack__vllm__config_dir: "{{ __docker_stack__vllm__base_dir }}/config"
__docker_stack__vllm__data_dir: "{{ __docker_stack__vllm__base_dir }}/data"

__docker_stack__vllm__image_default: vllm/vllm-openai:latest
#__docker_stack__vllm__image_default: vllm/vllm-openai:v0.24.0
__docker_stack__vllm__image: "{{ docker_stack__vllm__image
  | d(__docker_stack__vllm__image_default) }}"

__docker_stack__vllm__domain: "{{ docker_stack__internal_domain | d('example.int') }}"

__docker_stack__vllm__host_addr_default: "vllm.{{ __docker_stack__vllm__domain }}"
__docker_stack__vllm__host_addr: "{{ docker_stack__vllm__host_addr
  | d(__docker_stack__vllm__host_addr_default) }}"

__docker_stack__vllm__internal_http_port: 8000

__docker_stack__vllm__http_port: "{{ docker_stack__vllm__http_port | d('8001') }}"

#__docker_stack__vllm__container_cache_dir_default: "/app/.cache/huggingface"
__docker_stack__vllm__container_cache_dir_default: "/app/.cache"
__docker_stack__vllm__container_cache_dir: "{{
  docker_stack__vllm__container_cache_dir
  | d(__docker_stack__vllm__container_cache_dir_default) }}"

__docker_stack__vllm__container_models_dir_default: "/models"
__docker_stack__vllm__container_models_dir: "{{
  docker_stack__vllm__container_models_dir
  | d(__docker_stack__vllm__container_models_dir_default) }}"

__docker_stack__vllm__container_config_dir_default: "/app/.config"
__docker_stack__vllm__container_config_dir: "{{
  docker_stack__vllm__container_config_dir
  | d(__docker_stack__vllm__container_config_dir_default) }}"

__docker_stack__vllm__container_data_dir_default: "/data"
__docker_stack__vllm__container_data_dir: "{{
  docker_stack__vllm__container_data_dir
  | d(__docker_stack__vllm__container_data_dir_default) }}"

#__docker_stack__vllm__attention_backend_default: "FLASH_ATTN"
__docker_stack__vllm__attention_backend_default: "FLASHINFER"
__docker_stack__vllm__attention_backend: "{{
  docker_stack__vllm__attention_backend
  | d(__docker_stack__vllm__attention_backend_default) }}"

__docker_stack__vllm__api_key: "{{ docker_stack__vllm__api_key | d('') }}"

## -------------
## CODER MODEL PARAMETERS
## -------------
#__docker_stack__vllm__model_default: "Qwen/Qwen2.5-Coder-32B-Instruct-FP8"
#__docker_stack__vllm__model_default: "Qwen/Qwen2.5-Coder-32B-Instruct-AWQ"
#__docker_stack__vllm__model_default: "Qwen/Qwen3-30B-A3B-FP8"
#__docker_stack__vllm__model_default: "QuantTrio/Qwen3.8-27B-AWQ"
#__docker_stack__vllm__model_default: "Qwen/Qwen3.8-27B"
__docker_stack__vllm__model_default: "unsloth/Qwen3.8-27B-NVFP4"
__docker_stack__vllm__model: "{{ docker_stack__vllm__model
  | d(__docker_stack__vllm__model_default) }}"

#__docker_stack__vllm__gpu_memory_utilization_default: "0.52"
#__docker_stack__vllm__gpu_memory_utilization_default: "0.48"
__docker_stack__vllm__gpu_memory_utilization_default: "0.45"
__docker_stack__vllm__gpu_memory_utilization: "{{
  docker_stack__vllm__gpu_memory_utilization
  | d(__docker_stack__vllm__gpu_memory_utilization_default) }}"

__docker_stack__vllm__max_model_len_default: 65536
#__docker_stack__vllm__max_model_len_default: 32768
#__docker_stack__vllm__max_model_len_default: 16384
__docker_stack__vllm__max_model_len: "{{ docker_stack__vllm__max_model_len
  | d(__docker_stack__vllm__max_model_len_default) }}"

#__docker_stack__vllm__kv_cache_dtype_default: "auto"
#__docker_stack__vllm__kv_cache_dtype_default: "fp8_e5m2"
__docker_stack__vllm__kv_cache_dtype_default: "fp8"
__docker_stack__vllm__kv_cache_dtype: "{{ docker_stack__vllm__kv_cache_dtype
  | d(__docker_stack__vllm__kv_cache_dtype_default) }}"

#__docker_stack__vllm__quantization_default: "awq"
#__docker_stack__vllm__quantization_default: "fp8"
__docker_stack__vllm__quantization_default: "nvfp4"
__docker_stack__vllm__quantization: "{{ docker_stack__vllm__quantization
  | d(__docker_stack__vllm__quantization_default) }}"

## Since vllm-coder is utilizing a Qwen-Coder variant, qwen is ideal.
__docker_stack__vllm__tool_call_parser_default: "qwen3_coder"
#__docker_stack__vllm__tool_call_parser_default: "herring"
#__docker_stack__vllm__tool_call_parser_default: "mistral"
#__docker_stack__vllm__tool_call_parser_default: "llama"
#__docker_stack__vllm__tool_call_parser_default: "hermes"
__docker_stack__vllm__tool_call_parser: "{{
  docker_stack__vllm__tool_call_parser
  | d(__docker_stack__vllm__tool_call_parser_default) }}"

__docker_stack__vllm__reasoning_parser_default: "qwen3"
__docker_stack__vllm__reasoning_parser: "{{
  docker_stack__vllm__reasoning_parser
  | d(__docker_stack__vllm__reasoning_parser_default) }}"

__docker_stack__vllm__cuda_visible_devices: "{{
  docker_stack__vllm__cuda_visible_devices | d(0) }}"

__docker_stack__vllm__cuda_compute_capability: "{{
  docker_stack__vllm__cuda_compute_capability | d(120) }}"

__docker_stack__vllm__limit_mm_per_prompt: "{{
  docker_stack__vllm__limit_mm_per_prompt | d(5) }}"

## Remove the operational flags from vllm.env that were triggering the
## 'Unknown vLLM environment variable' detected warnings
## Keep only runtime system/cache variables in 'vllm.env'
__docker_stack__vllm__environment_default:
  # vLLM Engine Configuration Settings
#  VLLM_ATTENTION_BACKEND: "{{ __docker_stack__vllm__attention_backend }}"
#  VLLM_USE_DEEP_GEMM: 0
#  VLLM_DISABLED_KERNELS: "DeepGemmFp8BlockScaledMMKernel"

  # --- Secure the API Server ---
  # Replace with a vault variable or secure string
  VLLM_API_KEY: "{{ __docker_stack__vllm__api_key }}"

  CUDA_VISIBLE_DEVICES: "{{ __docker_stack__vllm__cuda_visible_devices }}"
  CUDA_COMPUTE_CAPABILITY: "{{ __docker_stack__vllm__cuda_compute_capability }}"

  HF_HOME: "{{ __docker_stack__vllm__container_models_dir }}"

  # --- Prevents FlashInfer from trying to write to root-level /.cache ---
  FLASHINFER_WORKSPACE_DIR: "{{ __docker_stack__vllm__container_models_dir }}/flashinfer"

  # --- Redirect Triton away from /app/.triton ---
  TRITON_CACHE_DIR: "{{ __docker_stack__vllm__container_models_dir }}/triton"

  # --- Bypasses the PyTorch getpwuid() KeyError ---
  USER: "{{ docker_stack__user_username }}"
  LOGNAME: "{{ docker_stack__user_username }}"

__docker_stack__vllm__environment: "{{
  docker_stack__vllm__environment
  | d(__docker_stack__vllm__environment_default) }}"

__docker_stack__vllm__deploy_resources_standalone:
  reservations:
    devices:
      - driver: nvidia
        count: all
        capabilities: [gpu]
#      - driver: nvidia
#        # or device_ids: ["0"] if you want specific GPU
#        count: all
#        capabilities: [gpu]

__docker_stack__vllm__deploy_resources_swarm:
  reservations:
    generic_resources:
      - discrete_resource_spec:
          kind: NVIDIA-GPU
          value: 1

__docker_stack__vllm__deploy_resources: "{{
  __docker_stack__vllm__deploy_resources_swarm
  if docker_stack__swarm_mode
  else __docker_stack__vllm__deploy_resources_standalone }}"

__docker_stack__vllm__config_dirs:
  - path: "{{ __docker_stack__vllm__base_dir }}"
  - path: "{{ __docker_stack__vllm__cache_dir }}"
  - path: "{{ __docker_stack__vllm__models_dir }}"
  - path: "{{ __docker_stack__vllm__config_dir }}"
  - path: "{{ __docker_stack__vllm__data_dir }}"

__docker_stack__vllm__config_templates:
  - src: "vllm/vllm.env.j2"
    dest: "{{ __docker_stack__vllm__base_dir }}/vllm.env"
  - src: "vllm/config-group.conf.j2"
    dest: "{{ __docker_stack__vllm__base_dir }}/group"
  - src: "vllm/config-passwd.conf.j2"
    dest: "{{ __docker_stack__vllm__base_dir }}/passwd"

__docker_stack__vllm__firewalld_ports:
  - "{{ __docker_stack__vllm__http_port }}/tcp"

__docker_stack__vllm__traefik_labels: "{{
  docker_stack__vllm__traefik_labels
  | d(__docker_stack__vllm__traefik_labels_default) }}"

__docker_stack__vllm__services:
  # Heavy Coding & Reasoning Layer
  vllm:
    image: "{{ __docker_stack__vllm__image }}"
    container_name: vllm
    restart: unless-stopped
    working_dir: /app
    networks:
      - "{{ docker_stack__network_name__traefik_proxy }}"
    ports:
      - "{{ __docker_stack__vllm__http_port }}:{{ __docker_stack__vllm__internal_http_port }}"
    env_file:
      - vllm/vllm.env
    healthcheck:
      test: >-
        curl -f -H 'Authorization: Bearer "$${VLLM_API_KEY}"' http://localhost:8000/health || exit 1
#      test: [
#        "CMD-SHELL",
#        "curl -f -H 'Authorization: Bearer $${VLLM_API_KEY}' http://localhost:8000/health || exit 1"
#      ]
      interval: 15s
      timeout: 5s
      retries: 3
      # Generous window for 32B model disk-to-VRAM transfers
      start_period: 10m
    command: |
      {{ __docker_stack__vllm__model }}
      --served-model-name qwen-coder
      --gpu-memory-utilization {{ __docker_stack__vllm__gpu_memory_utilization }}
      --max-model-len {{ __docker_stack__vllm__max_model_len }}
      --kv-cache-dtype {{ __docker_stack__vllm__kv_cache_dtype }}
      --attention-backend {{ __docker_stack__vllm__attention_backend }}
      --enable-auto-tool-choice
      --tool-call-parser {{ __docker_stack__vllm__tool_call_parser }}
      --reasoning-parser {{ __docker_stack__vllm__reasoning_parser }}
      --limit-mm-per-prompt.image {{ __docker_stack__vllm__limit_mm_per_prompt }}
      --safetensors-load-strategy=prefetch
      --enforce-eager
    labels: "{{ __docker_stack__vllm__traefik_labels }}"
    deploy:
      mode: replicated
      placement:
        constraints:
          - node.role == manager
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
      # Explicitly designed to interface with the nvidia-container-toolkit CLI layer on single-node environments.
      resources: "{{ __docker_stack__vllm__deploy_resources }}"
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - "{{ __docker_stack__vllm__base_dir }}/passwd:/etc/passwd:ro"
      - "{{ __docker_stack__vllm__base_dir }}/group:/etc/group:ro"
      - "{{ __docker_stack__vllm__cache_dir }}:{{ __docker_stack__vllm__container_cache_dir }}"
      - "{{ __docker_stack__vllm__models_dir }}:{{ __docker_stack__vllm__container_models_dir }}"
      - "{{ __docker_stack__vllm__config_dir }}:{{ __docker_stack__vllm__container_config_dir }}"
      - "{{ __docker_stack__vllm__data_dir }}:{{ __docker_stack__vllm__container_data_dir }}"

docker_stack__appspec__vllm:
  dirs: "{{ __docker_stack__vllm__config_dirs | d([], true) }}"
  files: "{{ __docker_stack__vllm__config_files | d([], true) }}"
  templates: "{{ __docker_stack__vllm__config_templates | d([], true) }}"
  firewalld_services: "{{ __docker_stack__vllm__firewalld_services | d([], true) }}"
  firewalld_ports: "{{ __docker_stack__vllm__firewalld_ports | d([], true) }}"
  networks: "{{ __docker_stack__vllm__networks | d({}, true) }}"
  volumes: "{{ __docker_stack__vllm__volumes | d({}, true) }}"
  docker_services: "{{ __docker_stack__vllm__services | d({}, true) }}"
