---

__docker_stack__vllm__stack_dir: "{{ docker_stack__dir | d('/home/user/docker-dirs') }}"
__docker_stack__vllm__base_dir: "{{ __docker_stack__vllm__stack_dir }}/vllm"
__docker_stack__vllm__cache_dir_coder: "{{ __docker_stack__vllm__base_dir }}/cache-coder"
__docker_stack__vllm__cache_dir_execution: "{{ __docker_stack__vllm__base_dir }}/cache-execution"
__docker_stack__vllm__models_dir: "{{ __docker_stack__vllm__base_dir }}/models"
__docker_stack__vllm__config_dir: "{{ __docker_stack__vllm__base_dir }}/config"

#__docker_stack__vllm__execution_image_default: vllm/vllm-openai:latest
__docker_stack__vllm__execution_image_default: "vllm/vllm-openai:nightly-{{
  __docker_stack__architecture }}"
__docker_stack__vllm__execution_image: "{{ docker_stack__vllm__execution_image
  | d(__docker_stack__vllm__execution_image_default) }}"

__docker_stack__vllm__coder_image_default: vllm/vllm-openai:latest
#__docker_stack__vllm__image_default: vllm/vllm-openai:v0.24.0
__docker_stack__vllm__coder_image: "{{ docker_stack__vllm__coder_image
  | d(__docker_stack__vllm__coder_image_default) }}"

__docker_stack__vllm__domain: "{{ docker_stack__internal_domain | d('example.int') }}"

__docker_stack__vllm__host_addr_execution_default: "vllm-exec.{{ __docker_stack__vllm__domain }}"
__docker_stack__vllm__host_addr_execution: "{{ docker_stack__vllm__host_addr_execution
  | d(__docker_stack__vllm__host_addr_execution_default) }}"

__docker_stack__vllm__host_addr_coder_default: "vllm.{{ __docker_stack__vllm__domain }}"
__docker_stack__vllm__host_addr_coder: "{{ docker_stack__vllm__host_addr_coder
  | d(__docker_stack__vllm__host_addr_coder_default) }}"

__docker_stack__vllm__internal_http_port: 8000

__docker_stack__vllm__http_port_execution: "{{ docker_stack__vllm__http_port | d('8000') }}"
__docker_stack__vllm__http_port_coder: "{{ docker_stack__vllm__http_port | d('8001') }}"

#__docker_stack__vllm__container_cache_dir_default: "/app/.cache/huggingface"
__docker_stack__vllm__container_cache_dir_default: "/app/.cache"
__docker_stack__vllm__container_cache_dir: "{{
  docker_stack__vllm__container_cache_dir
  | d(__docker_stack__vllm__container_cache_dir_default) }}"

__docker_stack__vllm__container_models_dir_default: "/models"
__docker_stack__vllm__container_models_dir: "{{
  docker_stack__vllm__container_models_dir
  | d(__docker_stack__vllm__container_models_dir_default) }}"

__docker_stack__vllm__container_config_dir_default: "/app/.config"
__docker_stack__vllm__container_config_dir: "{{
  docker_stack__vllm__container_config_dir
  | d(__docker_stack__vllm__container_config_dir_default) }}"

#__docker_stack__vllm__attention_backend_default: "FLASH_ATTN"
__docker_stack__vllm__attention_backend_default: "FLASHINFER"
__docker_stack__vllm__attention_backend: "{{
  docker_stack__vllm__attention_backend
  | d(__docker_stack__vllm__attention_backend_default) }}"

__docker_stack__vllm__api_key: "{{ docker_stack__vllm__api_key | d('') }}"

## -------------
## EXECUTION MODEL PARAMETERS
## -------------
#__docker_stack__vllm__model_execution_default: "nvidia/Nemotron-3.5-Lightning-30B-A3B-NVFP4"
#__docker_stack__vllm__model_execution_default: "nvidia/Nemotron-3.5-Lightning-NVFP4"
__docker_stack__vllm__model_execution_default: "nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4"
__docker_stack__vllm__model_execution: "{{ docker_stack__vllm__model_execution
  | d(__docker_stack__vllm__model_execution_default) }}"

__docker_stack__vllm__speculative_model_execution_default: "nvidia/Nemotron-3.5-Lightning-30B-A3B-NVFP4"
__docker_stack__vllm__speculative_model_execution: "{{
  docker_stack__vllm__speculative_model_execution
  | d(__docker_stack__vllm__speculative_model_execution_default) }}"

__docker_stack__vllm__num_speculative_tokens: "{{
  docker_stack__vllm__num_speculative_tokens | d(3) }}"

#__docker_stack__vllm__gpu_memory_utilization_execution_default: "0.38"
#__docker_stack__vllm__gpu_memory_utilization_execution_default: "0.35"
__docker_stack__vllm__gpu_memory_utilization_execution_default: "0.40"
__docker_stack__vllm__gpu_memory_utilization_execution: "{{
  docker_stack__vllm__gpu_memory_utilization_execution
  | d(__docker_stack__vllm__gpu_memory_utilization_execution_default) }}"

#__docker_stack__vllm__max_model_len_execution_default: 32768
__docker_stack__vllm__max_model_len_execution_default: 16384
__docker_stack__vllm__max_model_len_execution: "{{ docker_stack__vllm__max_model_len_execution
  | d(__docker_stack__vllm__max_model_len_execution_default) }}"

__docker_stack__vllm__kv_cache_dtype_execution_default: "fp8"
__docker_stack__vllm__kv_cache_dtype_execution: "{{ docker_stack__vllm__kv_cache_dtype_execution
  | d(__docker_stack__vllm__kv_cache_dtype_execution_default) }}"

__docker_stack__vllm__quantization_execution_default: "nvfp4"
__docker_stack__vllm__quantization_execution: "{{ docker_stack__vllm__quantization_execution
  | d(__docker_stack__vllm__quantization_execution_default) }}"

## Since vllm-coder is utilizing a Qwen-Coder variant, qwen is ideal.
#__docker_stack__vllm__tool_call_parser_execution_default: "qwen3_coder"
__docker_stack__vllm__tool_call_parser_execution_default: "pythonic"
__docker_stack__vllm__tool_call_parser_execution: "{{
  docker_stack__vllm__tool_call_parser_execution
  | d(__docker_stack__vllm__tool_call_parser_execution_default) }}"

__docker_stack__vllm__reasoning_parser_coder_default: "qwen3"
__docker_stack__vllm__reasoning_parser_coder: "{{
  docker_stack__vllm__reasoning_parser_coder
  | d(__docker_stack__vllm__reasoning_parser_coder_default) }}"

## -------------
## CODER MODEL PARAMETERS
## -------------
#__docker_stack__vllm__model_coder_default: "Qwen/Qwen2.5-Coder-32B-Instruct-FP8"
#__docker_stack__vllm__model_coder_default: "Qwen/Qwen2.5-Coder-32B-Instruct-AWQ"
#__docker_stack__vllm__model_coder_default: "Qwen/Qwen3-30B-A3B-FP8"
#__docker_stack__vllm__model_coder_default: "QuantTrio/Qwen3.8-27B-AWQ"
#__docker_stack__vllm__model_coder_default: "Qwen/Qwen3.8-27B"
__docker_stack__vllm__model_coder_default: "unsloth/Qwen3.8-27B-NVFP4"
__docker_stack__vllm__model_coder: "{{ docker_stack__vllm__model_coder
  | d(__docker_stack__vllm__model_coder_default) }}"

#__docker_stack__vllm__gpu_memory_utilization_coder_default: "0.52"
#__docker_stack__vllm__gpu_memory_utilization_coder_default: "0.48"
__docker_stack__vllm__gpu_memory_utilization_coder_default: "0.45"
__docker_stack__vllm__gpu_memory_utilization_coder: "{{
  docker_stack__vllm__gpu_memory_utilization_coder
  | d(__docker_stack__vllm__gpu_memory_utilization_coder_default) }}"

__docker_stack__vllm__max_model_len_coder_default: 65536
#__docker_stack__vllm__max_model_len_coder_default: 32768
#__docker_stack__vllm__max_model_len_coder_default: 16384
__docker_stack__vllm__max_model_len_coder: "{{ docker_stack__vllm__max_model_len_coder
  | d(__docker_stack__vllm__max_model_len_coder_default) }}"

#__docker_stack__vllm__kv_cache_dtype_coder_default: "auto"
#__docker_stack__vllm__kv_cache_dtype_coder_default: "fp8_e5m2"
__docker_stack__vllm__kv_cache_dtype_coder_default: "fp8"
__docker_stack__vllm__kv_cache_dtype_coder: "{{ docker_stack__vllm__kv_cache_dtype_coder
  | d(__docker_stack__vllm__kv_cache_dtype_coder_default) }}"

#__docker_stack__vllm__quantization_coder_default: "awq"
#__docker_stack__vllm__quantization_coder_default: "fp8"
__docker_stack__vllm__quantization_coder_default: "nvfp4"
__docker_stack__vllm__quantization_coder: "{{ docker_stack__vllm__quantization_coder
  | d(__docker_stack__vllm__quantization_coder_default) }}"

## Since vllm-coder is utilizing a Qwen-Coder variant, qwen is ideal.
__docker_stack__vllm__tool_call_parser_coder_default: "qwen3_coder"
#__docker_stack__vllm__tool_call_parser_coder_default: "herring"
#__docker_stack__vllm__tool_call_parser_coder_default: "mistral"
#__docker_stack__vllm__tool_call_parser_coder_default: "llama"
#__docker_stack__vllm__tool_call_parser_coder_default: "hermes"
__docker_stack__vllm__tool_call_parser_coder: "{{
  docker_stack__vllm__tool_call_parser_coder
  | d(__docker_stack__vllm__tool_call_parser_coder_default) }}"

#__docker_stack__vllm__reasoning_parser_execution_default: "qwen3"
#__docker_stack__vllm__reasoning_parser_execution_default: "nim_reasoning"
__docker_stack__vllm__reasoning_parser_execution_default: "nemotron_v3"
__docker_stack__vllm__reasoning_parser_execution: "{{
  docker_stack__vllm__reasoning_parser_execution
  | d(__docker_stack__vllm__reasoning_parser_execution_default) }}"

__docker_stack__vllm__cuda_visible_devices: "{{
  docker_stack__vllm__cuda_visible_devices | d(0) }}"

__docker_stack__vllm__cuda_compute_capability: "{{
  docker_stack__vllm__cuda_compute_capability | d(120) }}"

__docker_stack__vllm__limit_mm_per_prompt: "{{
  docker_stack__vllm__limit_mm_per_prompt | d(5) }}"

## Remove the operational flags from vllm.env that were triggering the
## 'Unknown vLLM environment variable' detected warnings
## Keep only runtime system/cache variables in 'vllm.env'
__docker_stack__vllm__environment_default:
  # vLLM Engine Configuration Settings
#  VLLM_ATTENTION_BACKEND: "{{ __docker_stack__vllm__attention_backend }}"
#  VLLM_USE_DEEP_GEMM: 0
#  VLLM_DISABLED_KERNELS: "DeepGemmFp8BlockScaledMMKernel"

  # --- Secure the API Server ---
  # Replace with a vault variable or secure string
  VLLM_API_KEY: "{{ __docker_stack__vllm__api_key }}"

  CUDA_VISIBLE_DEVICES: "{{ __docker_stack__vllm__cuda_visible_devices }}"
  CUDA_COMPUTE_CAPABILITY: "{{ __docker_stack__vllm__cuda_compute_capability }}"

  HF_HOME: "{{ __docker_stack__vllm__container_models_dir }}"

  # --- Prevents FlashInfer from trying to write to root-level /.cache ---
  FLASHINFER_WORKSPACE_DIR: "{{ __docker_stack__vllm__container_models_dir }}/flashinfer"

  # --- Redirect Triton away from /app/.triton ---
  TRITON_CACHE_DIR: "{{ __docker_stack__vllm__container_models_dir }}/triton"

  # --- Bypasses the PyTorch getpwuid() KeyError ---
  USER: "{{ docker_stack__user_username }}"
  LOGNAME: "{{ docker_stack__user_username }}"

__docker_stack__vllm__environment: "{{ docker_stack__vllm__environment
  | d(__docker_stack__vllm__environment_default) }}"

__docker_stack__vllm__deploy_resources_standalone:
  reservations:
    devices:
      - driver: nvidia
        count: all
        capabilities: [gpu]
#      - driver: nvidia
#        # or device_ids: ["0"] if you want specific GPU
#        count: all
#        capabilities: [gpu]

__docker_stack__vllm__deploy_resources_swarm:
  reservations:
    generic_resources:
      - discrete_resource_spec:
          kind: NVIDIA-GPU
          value: 1

__docker_stack__vllm__deploy_resources: "{{
  __docker_stack__vllm__deploy_resources_swarm
  if docker_stack__swarm_mode
  else __docker_stack__vllm__deploy_resources_standalone }}"

__docker_stack__vllm__config_dirs:
  - path: "{{ __docker_stack__vllm__base_dir }}"
  - path: "{{ __docker_stack__vllm__cache_dir_coder }}"
  - path: "{{ __docker_stack__vllm__cache_dir_execution }}"
  - path: "{{ __docker_stack__vllm__models_dir }}"
  - path: "{{ __docker_stack__vllm__config_dir }}"

__docker_stack__vllm__config_templates:
  - src: "vllm/vllm.env.j2"
    dest: "{{ __docker_stack__vllm__base_dir }}/vllm.env"
  - src: "vllm/config-group.conf.j2"
    dest: "{{ __docker_stack__vllm__base_dir }}/group"
  - src: "vllm/config-passwd.conf.j2"
    dest: "{{ __docker_stack__vllm__base_dir }}/passwd"

__docker_stack__vllm__firewalld_ports:
  - "{{ __docker_stack__vllm__http_port_coder }}/tcp"

__docker_stack__vllm__traefik_labels_execution: "{{
  docker_stack__vllm__traefik_labels_execution
  | d(__docker_stack__vllm__traefik_labels_execution_default) }}"

__docker_stack__vllm__traefik_labels_coder: "{{
  docker_stack__vllm__traefik_labels_coder
  | d(__docker_stack__vllm__traefik_labels_coder_default) }}"

__docker_stack__vllm__services:
  # 1. Nemotron 3.5 Lightning (Routing / Agent Execution Layer)
  vllm-execution:
    image: "{{ __docker_stack__vllm__execution_image }}"
    container_name: vllm-execution
    restart: unless-stopped
    working_dir: /app
    networks:
      - "{{ docker_stack__network_name__traefik_proxy }}"
    ports:
      - "{{ __docker_stack__vllm__http_port_execution }}:{{ __docker_stack__vllm__internal_http_port }}"
    env_file:
      - vllm/vllm.env
    healthcheck:
      interval: 15s
      retries: 3
      # Generous window for model disk-to-VRAM transfers
      start_period: 5m
      test: >-
        curl -f -H 'Authorization: Bearer "$${VLLM_API_KEY}"' http://localhost:8000/health || exit 1
      timeout: 5s
    command: |
      {{ __docker_stack__vllm__model_execution }}
      --served-model-name nemotron-lightning
      --gpu-memory-utilization {{ __docker_stack__vllm__gpu_memory_utilization_execution }}
      --max-model-len {{ __docker_stack__vllm__max_model_len_execution }}
      --kv-cache-dtype {{ __docker_stack__vllm__kv_cache_dtype_execution }}
      --attention-backend {{ __docker_stack__vllm__attention_backend }}
      --speculative-decoding-mode draft_model
      --speculative-model {{ __docker_stack__vllm__speculative_model_execution }}
      --num-speculative-tokens {{ __docker_stack__vllm__num_speculative_tokens }}
      --enable-chunked-prefill
      --reasoning-parser {{ __docker_stack__vllm__reasoning_parser_execution }}
      --safetensors-load-strategy=prefetch
      --enforce-eager
    labels: "{{ __docker_stack__vllm__traefik_labels_execution }}"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              count: all
              driver: nvidia
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - "{{ __docker_stack__vllm__base_dir }}/passwd:/etc/passwd:ro"
      - "{{ __docker_stack__vllm__base_dir }}/group:/etc/group:ro"
      - "{{ __docker_stack__vllm__cache_dir_execution }}:{{ __docker_stack__vllm__container_cache_dir }}"
      - "{{ __docker_stack__vllm__models_dir }}:{{ __docker_stack__vllm__container_models_dir }}"
      - "{{ __docker_stack__vllm__config_dir }}:{{ __docker_stack__vllm__container_config_dir }}"

  # 2. Qwen 3.8 27B (Heavy Coding & Reasoning Layer)
  vllm-coder:
    image: "{{ __docker_stack__vllm__coder_image }}"
    container_name: vllm-coder
    restart: unless-stopped
    working_dir: /app
    networks:
      - "{{ docker_stack__network_name__traefik_proxy }}"
    ports:
      - "{{ __docker_stack__vllm__http_port_coder }}:{{ __docker_stack__vllm__internal_http_port }}"
    env_file:
      - vllm/vllm.env
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - "{{ __docker_stack__vllm__base_dir }}/passwd:/etc/passwd:ro"
      - "{{ __docker_stack__vllm__base_dir }}/group:/etc/group:ro"
      - "{{ __docker_stack__vllm__cache_dir_coder }}:{{ __docker_stack__vllm__container_cache_dir }}"
      - "{{ __docker_stack__vllm__models_dir }}:{{ __docker_stack__vllm__container_models_dir }}"
      - "{{ __docker_stack__vllm__config_dir }}:{{ __docker_stack__vllm__container_config_dir }}"
    command: |
      {{ __docker_stack__vllm__model_coder }}
      --served-model-name qwen-coder
      --gpu-memory-utilization {{ __docker_stack__vllm__gpu_memory_utilization_coder }}
      --max-model-len {{ __docker_stack__vllm__max_model_len_coder }}
      --kv-cache-dtype {{ __docker_stack__vllm__kv_cache_dtype_coder }}
      --attention-backend {{ __docker_stack__vllm__attention_backend }}
      --enable-auto-tool-choice
      --tool-call-parser {{ __docker_stack__vllm__tool_call_parser_coder }}
      --reasoning-parser {{ __docker_stack__vllm__reasoning_parser_coder }}
      --limit-mm-per-prompt.image {{ __docker_stack__vllm__limit_mm_per_prompt }}
      --safetensors-load-strategy=prefetch
      --enforce-eager
    healthcheck:
      test: >-
        curl -f -H 'Authorization: Bearer "$${VLLM_API_KEY}"' http://localhost:8000/health || exit 1
#      test: [
#        "CMD-SHELL",
#        "curl -f -H 'Authorization: Bearer $${VLLM_API_KEY}' http://localhost:8000/health || exit 1"
#      ]
      interval: 15s
      timeout: 5s
      retries: 3
      # Generous window for 32B model disk-to-VRAM transfers
      start_period: 10m
    labels: "{{ __docker_stack__vllm__traefik_labels_coder }}"
    deploy:
      mode: replicated
      placement:
        constraints:
          - node.role == manager
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
      # Explicitly designed to interface with the nvidia-container-toolkit CLI layer on single-node environments.
      resources: "{{ __docker_stack__vllm__deploy_resources }}"

docker_stack__appspec__vllm:
  dirs: "{{ __docker_stack__vllm__config_dirs | d([], true) }}"
  files: "{{ __docker_stack__vllm__config_files | d([], true) }}"
  templates: "{{ __docker_stack__vllm__config_templates | d([], true) }}"
  firewalld_services: "{{ __docker_stack__vllm__firewalld_services | d([], true) }}"
  firewalld_ports: "{{ __docker_stack__vllm__firewalld_ports | d([], true) }}"
  networks: "{{ __docker_stack__vllm__networks | d({}, true) }}"
  volumes: "{{ __docker_stack__vllm__volumes | d({}, true) }}"
  docker_services: "{{ __docker_stack__vllm__services | d({}, true) }}"
