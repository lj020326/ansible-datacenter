---

__docker_stack__jenkins__host_environment: "{{ docker_stack__jenkins__host_environment | d(docker_stack__host_environment, true) }}"

__docker_stack__jenkins__ansible_tool_python_interpreter_default: "python3"
#__docker_stack__jenkins__ansible_tool_python_interpreter_default: "python3.10"
#__docker_stack__jenkins__ansible_tool_python_interpreter_default: python3.12
__docker_stack__jenkins__ansible_tool_python_interpreter: "{{
  docker_stack__jenkins__ansible_tool_python_interpreter
  | d(__docker_stack__jenkins__ansible_tool_python_interpreter_default, true) }}"

__docker_stack__jenkins__package_requirements:
  - "{{ __docker_stack__jenkins__ansible_tool_python_interpreter }}"

__docker_stack__jenkins__stack_dir: "{{ docker_stack__dir | d('/home/user/docker-dirs') }}"
__docker_stack__jenkins__base_dir_default: "{{ __docker_stack__jenkins__stack_dir }}/jenkins"
__docker_stack__jenkins__base_dir: "{{ docker_stack__jenkins__base_dir
  | d(__docker_stack__jenkins__base_dir_default, true) }}"

__docker_stack__jenkins__traefik_host_default: jenkins.example.int
__docker_stack__jenkins__host: "{{
  docker_stack__jenkins__host
  | d(docker_stack__jenkins_host, true)
  | d(docker_stack__traefik__host, true)
  | d(__docker_stack__jenkins__traefik_host_default, true) }}"

#__docker_stack__jenkins__agent_base_dir_default: "{{ __docker_stack__jenkins__stack_dir }}/jenkins_agent"
__docker_stack__jenkins__agent_base_dir_default: /var/lib/jenkins-agent
__docker_stack__jenkins__agent_base_dir: "{{ docker_stack__jenkins__agent_base_dir
  | d(__docker_stack__jenkins__agent_base_dir_default, true) }}"

__docker_stack__jenkins__http: "{{ docker_stack__jenkins__http | d('10180', true) }}"

## ref: https://www.jenkins.io/blog/2020/05/11/docker-windows-agents/
## ref: https://support.cloudbees.com/hc/en-us/articles/115001771692-How-to-Create-Permanent-Agents-with-Docker
## ref: https://github.com/jenkinsci/docker-inbound-agent
## ref: https://wiki.tds.tieto.com/display/TDSKB/Executing+Jenkins+jobs+when+only+one+way+network+connection+exists
__docker_stack__jenkins__agent_port: "{{ docker_stack__jenkins__agent_port | d('9000', true) }}"
__docker_stack__jenkins__agent_tcp_port: "{{ docker_stack__jenkins__tcp_port | d('9000', true) }}"
__docker_stack__jenkins__agent_ssh_port: "{{ docker_stack__jenkins__ssh_port | d('4444', true) }}"

__docker_stack__jenkins__agent_tunnel: "{{ __docker_stack__jenkins_endpoint }}:9000"

__docker_stack__jenkins__mgr_pwd_secret: "{{ docker_stack__jenkins__mgr_pwd_secret | d('00000000000000000000000', true) }}"

__docker_stack__jenkins__agent_username: "{{ docker_stack__jenkins__agent_username | d('00000000000000000000000', true) }}"
__docker_stack__jenkins__agent_password: "{{ docker_stack__jenkins__agent_password | d('00000000000000000000000', true) }}"

__docker_stack__jenkins__agent_swarm_mode: true

## ref: https://www.jenkins.io/blog/2020/05/11/docker-windows-agents/
#__docker_stack__jenkins__image_default: "jenkins/jenkins:lts"
#__docker_stack__jenkins__image_default: "{{ docker_stack__registry__endpoint }}/docker-jenkins-jcac:build-131"
__docker_stack__jenkins__image_default: "{{ docker_stack__registry__endpoint }}/docker-jenkins-jcac:latest"
__docker_stack__jenkins__image: "{{ docker_stack__jenkins__image | d(__docker_stack__jenkins__image_default, true) }}"

__docker_stack__jenkins__agent_image_default: "{{ docker_stack__registry__endpoint }}/jenkins-docker-cicd-agent:latest"
__docker_stack__jenkins__agent_image: "{{ docker_stack__jenkins__agent_image
  | d(__docker_stack__jenkins__agent_image_default, true) }}"

__docker_stack__jenkins__swarm_agent_image_default: "{{ docker_stack__registry__endpoint }}/jenkins-swarm-agent:latest"
__docker_stack__jenkins__swarm_agent_image: "{{ docker_stack__jenkins_swarm_agent_image
  | d(__docker_stack__jenkins__swarm_agent_image_default, true) }}"

__docker_stack__jenkins__ldap_host: "{{ docker_stack__jenkins__ldap_host
  | d(docker_stack__ldap__host, true) }}"
__docker_stack__jenkins__ldap_uri: "{{ docker_stack__jenkins__ldap_uri
  | d(docker_stack__ldap__uri, true) | d(docker_stack__ldap__host, true) }}"
__docker_stack__jenkins__ldap_base_dn: "{{ docker_stack__jenkins__ldap_base_dn
  | d(docker_stack__ldap__base_dn, true) }}"

__docker_stack__jenkins__ldap_bind_user_dn_default: "cn=readonly,{{ __docker_stack__jenkins__ldap_base_dn
  | d(docker_stack__ldap__user_base_dn, true) }}"
__docker_stack__jenkins__ldap_bind_user_dn: "{{ docker_stack__jenkins__ldap_bind_user_dn
  | d(docker_stack__ldap__bind_user_dn, true) | d(__docker_stack__jenkins__ldap_bind_user_dn_default, true) }}"
__docker_stack__jenkins__ldap_bind_user_password: "{{ docker_stack__jenkins__ldap_bind_user_password
  | d(docker_stack__ldap__bind_user_password, true) }}"

#__docker_stack__jenkins_ssh_private_key: "{{ docker_stack__jenkins_ssh_private_key | d('', true) }}"
#__docker_stack__jenkins_ssh_public_key: "{{ docker_stack__jenkins_ssh_public_key | d('', true) }}"

#__docker_stack__jenkins__data_dir_default: /export/data/jenkins/osimages
#__docker_stack__jenkins__data_dir_default: /export/data/jenkins
__docker_stack__jenkins__data_dir_default: /data/datacenter/jenkins
__docker_stack__jenkins__data_dir: "{{ docker_stack__jenkins__data_dir
  | d(__docker_stack__jenkins__data_dir_default, true) }}"

__docker_stack__jenkins__pipeline_lib_repo_default: https://gitea.example.int/infra/pipeline-automation-lib.git
__docker_stack__jenkins__pipeline_lib_repo: "{{ docker_stack__jenkins__pipeline_lib_repo
  | d(__docker_stack__jenkins__pipeline_lib_repo_default, true) }}"

__docker_stack__jenkins__pipeline_lib_credential_id_default: my-ssh-cred
__docker_stack__jenkins__pipeline_lib_credential_id: "{{ docker_stack__jenkins__pipeline_lib_credential_id
  | d(docker_stack__jenkins__pipeline_lib_credential_id_default, true) }}"

__docker_stack__jenkins__vmware_data_dir_default: /data/datacenter/vmware
__docker_stack__jenkins__vmware_data_dir: "{{ docker_stack__jenkins__vmware_data_dir
  | d(__docker_stack__jenkins__vmware_data_dir_default, true) }}"

__docker_stack__jenkins__config_dirs:
  - path: "{{ __docker_stack__jenkins__base_dir }}"
  - path: "{{ __docker_stack__jenkins__base_dir }}/jenkins_home"
  - path: "{{ __docker_stack__jenkins__base_dir }}/jenkins_home/casc_configs"
  - path: "{{ __docker_stack__jenkins__data_dir }}"
  - path: "{{ __docker_stack__jenkins__data_dir }}/osimages"
  - path: "{{ __docker_stack__jenkins__vmware_data_dir }}"
  - path: "{{ __docker_stack__jenkins__agent_base_dir }}"

__docker_stack__jenkins__config_templates:
  - src: jenkins/jenkins.env.j2
    dest: "{{ __docker_stack__jenkins__base_dir }}/jenkins.env"
  - src: jenkins/jenkins_casc.yml.j2
    dest: "{{ __docker_stack__jenkins__base_dir }}/jenkins_home/casc_configs/jenkins.yml"
  - src: jenkins/job_dsl/seedjob.groovy
    dest: "{{ __docker_stack__jenkins__base_dir }}/jenkins_home/casc_configs/seedjob.groovy"
    force: true
  - src: jenkins/config-group.conf.j2
    dest: "{{ __docker_stack__jenkins__base_dir }}/group"
  - src: jenkins/config-passwd.conf.j2
    dest: "{{ __docker_stack__jenkins__base_dir }}/passwd"

__docker_stack__jenkins__firewalld_ports:
  - "{{ __docker_stack__jenkins__agent_tcp_port }}/tcp"
  - "{{ __docker_stack__jenkins__agent_ssh_port }}/tcp"

__docker_stack__jenkins__ansible_venv_libs_default:
  - jmespath
  - netaddr
  - requests
  - requests-credssp
  - pywinrm
  - passlib
  - ruamel.yaml
  - dnspython
  - pytz
  - py
  - pytest
  - pytest-shell-utilities
  - pytest-parallel
  - python-dateutil
  - ansible-lint
  - ansible-lint-junit
  - yamllint
  - yaml-lint-to-junit-xml
  - edgegrid-python
  - defusedxml
  #####################
  ## molecule related requirements
  ##'ansible-compat<4' is required due to https://github.com/ansible-community/molecule/issues/3903
  ## if moving to latest ansible-compat  - we get error "AttributeError: 'Runtime' object has no attribute 'exec'"
  - ansible-compat
  - molecule
  ## installing the molecule docker plugin leads to issue:
  ## "Failed to detect selinux python bindings at"
  #- molecule-plugins[docker]

#__docker_stack__jenkins__ansible_lib_default: "ansible"
## ref: ## ref: https://www.jeffgeerling.com/blog/2024/newer-versions-ansible-dont-work-rhel-8
## ref: https://pypi.org/project/ansible-core/#history
#__docker_stack__jenkins__ansible_lib_default: ansible-core==2.18.4
#__docker_stack__jenkins__ansible_lib_default: ansible-core==2.17.6
#__docker_stack__jenkins__ansible_lib_default: ansible-core==2.16.3
__docker_stack__jenkins__ansible_lib_default: ansible-core==2.21.2

__docker_stack__jenkins__ansible_lib: "{{ docker_stack__jenkins__ansible_lib
  | d(__docker_stack__jenkins__ansible_lib_default, true) }}"

__docker_stack__jenkins__ansible_venv_libs: "{{ docker_stack__jenkins__ansible_venv_libs
  | d(__docker_stack__jenkins__ansible_venv_libs_default, true) }}"

__docker_stack__jenkins__java_opts_list:
  - -Djenkins.install.runSetupWizard=false
  - -Djava.awt.headless=true
  - -Djavax.net.ssl.trustStore=/var/lib/jenkins/cacerts
  - -Djavax.net.ssl.trustStorePassword={{ __docker_stack__jenkins__cred_java_truststore_password }}

__docker_stack__jenkins__java_opts: "{{ __docker_stack__jenkins__java_opts_list | join(' ') }}"

## ref: https://stackoverflow.com/questions/29539234/system-properties-management
## ref: https://github.com/Checkmarx/kics/blob/master/docs/integrations_jenkins.md
__docker_stack__jenkins__jenkins_java_opts_list:
  - -Dhudson.model.DirectoryBrowserSupport.CSP=http://* 'unsafe-inline' 'unsafe-eval'; script-src 'self' http://* 'unsafe-inline' 'unsafe-eval'

__docker_stack__jenkins__jenkins_java_opts: "{{ __docker_stack__jenkins__jenkins_java_opts_list | join(' ') }}"

__docker_stack__jenkins__agent_min_num_executors: 4

## ref: https://plugins.jenkins.io/throttle-concurrents/
__docker_stack__jenkins__throttle_job_properties:
  categories:
    - categoryName: "docker_image_builds"
      maxConcurrentTotal: 4
      maxConcurrentPerNode: 2
    - categoryName: "ansible_test"
      maxConcurrentTotal: 4
      maxConcurrentPerNode: 2
#      nodeLabeledPairs:
#      - throttledNodeLabel: "docker"
#        maxConcurrentPerNodeLabeled: 1

## ref: https://stackoverflow.com/questions/39539559/ansible-procesor-count-vs-processor-cores-vs-processor-vcpus
## ref: github.com/ansible/ansible/pull/66569
#__docker_stack__jenkins__agent_num_executors: "{{
#  [ansible_facts['processor_cores'] | d(1, true)*2, __docker_stack__jenkins__agent_min_num_executors] | max }}"
#__docker_stack__jenkins__agent_num_executors: "{{
#  [ansible_facts['processor_vcpus'] | d(1, true)*2, __docker_stack__jenkins__agent_min_num_executors] | max }}"
__docker_stack__jenkins__agent_num_executors: "{{
  [ansible_facts['processor_nproc'] | d(1, true)*4, __docker_stack__jenkins__agent_min_num_executors] | max }}"

