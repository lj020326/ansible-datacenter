__docker_stack__jenkins__environment_default:
  ## ref: https://www.jenkins.io/doc/book/managing/casc/
  #CASC_JENKINS_CONFIG=/var/jenkins_home/jenkins_casc.yml
  CASC_JENKINS_CONFIG: "/var/jenkins_home/casc_configs/jenkins.yml"
  ## ref: https://github.com/Checkmarx/kics/blob/master/docs/integrations_jenkins.md
  ## ref: https://stackoverflow.com/questions/29539234/system-properties-management
  JAVA_OPTS: "{{ __docker_stack__jenkins__java_opts }}"
  #JAVA_OPTS=-Djenkins.install.runSetupWizard=false -Djava.awt.headless=true -Djavax.net.ssl.trustStore=/var/lib/jenkins/cacerts -Djavax.net.ssl.trustStorePassword=changeit
  ## ref: https://stackoverflow.com/questions/29539234/system-properties-management
  JENKINS_JAVA_OPTS: "{{ __docker_stack__jenkins__jenkins_java_opts | quote }}"
  #JENKINS_HOST=http://localhost:8080
  JENKINS_HOST: "https://{{ __docker_stack__jenkins_endpoint }}"
  JENKINS_SLAVE_AGENT_PORT: "9000"
  JENKINS_ENV: "{{ __docker_stack__jenkins__host_environment }}"
  JENKINS_OPTS: "{{ __docker_stack__jenkins__jenkins_opts | d('', true) }}"
  TZ: "{{ docker_stack__timezone }}"
  # prometheus
  COLLECT_DISK_USAGE: "true"
  COLLECTING_METRICS_PERIOD_IN_SECONDS: "180"

  ## ref: https://github.com/jenkinsci/docker/pull/577
  #PLUGINS_FORCE_UPGRADE: 'true'
  #JENKINS_UC_DOWNLOAD: "http://updates.jenkins.io"
  #JENKINS_UC_DOWNLOAD: "http://updates.jenkins-ci.org"
  #JENKINS_UC_DOWNLOAD: "https://mirrors.xmission.com/jenkins/updates/update-center.json"

  #SAML_XML: "CHANGE_ME"
  #SAML_URL: "http://localhost"

  #ENV_SECRETS_DEBUG=true

  ################################
  ## vaulted credentials
  ANSIBLE_VAULT_PASSWORD: "{{
    __docker_stack__jenkins__cred_ansible_vault_password if not docker_stack__swarm_mode
      else 'dksec://ansible_vault_password' }}"
  ANSIBLE_VAULT_PASSWORD_FILE: "{{ 'dkseckey://ansible_vault_password' if docker_stack__swarm_mode else omit }}"

  ANSIBLE_SSH_USERNAME: "{{
    __docker_stack__jenkins__cred_ansible_ssh_username if not docker_stack__swarm_mode
      else 'dksec://ansible_ssh_username' }}"
  ANSIBLE_SSH_PASSWORD: "{{
    __docker_stack__jenkins__cred_ansible_ssh_password if not docker_stack__swarm_mode
      else 'dksec://ansible_ssh_password' }}"
  ANSIBLE_SSH_PRIVATE_KEY: "{{
    __docker_stack__jenkins__cred_ansible_ssh_key if not docker_stack__swarm_mode
      else 'dkseckey://ansible_ssh_private_key' }}"

  ## PULP
  PULP_API_TOKEN: "{{
    __docker_stack__jenkins__pulp_api_token if not docker_stack__swarm_mode
      else 'dksec://pulp_api_token' }}"
  PULP_ADMIN_USERNAME: "{{
    __docker_stack__jenkins__pulp_admin_username if not docker_stack__swarm_mode
      else 'dksec://pulp_admin_username' }}"
  PULP_ADMIN_PASSWORD: "{{
    __docker_stack__jenkins__pulp_admin_password if not docker_stack__swarm_mode
      else 'dksec://pulp_admin_password' }}"

  ## LLM / VLLM
  LLAMA_API_KEY: "{{
    __docker_stack__jenkins__llama_api_key if not docker_stack__swarm_mode
      else 'dksec://llama_api_key' }}"
  OLLAMA_API_KEY: "{{
    __docker_stack__jenkins__ollama_api_key if not docker_stack__swarm_mode
      else 'dksec://ollama_api_key' }}"
  VLLM_API_KEY: "{{
    __docker_stack__jenkins__vllm_api_key if not docker_stack__swarm_mode
      else 'dksec://vllm_api_key' }}"

  # DOCKER_REGISTRY_PASSWORD: "{{
  #  __docker_stack__jenkins__cred_docker_registry_admin_password if not docker_stack__swarm_mode
  #   else 'dksec://docker_registry_password' }}"
  DOCKER_REGISTRY_ADMIN_USERNAME: "{{
    __docker_stack__jenkins__cred_docker_registry_admin_username if not docker_stack__swarm_mode
      else 'dksec://docker_registry_admin_username' }}"
  DOCKER_REGISTRY_ADMIN_PASSWORD: "{{
    __docker_stack__jenkins__cred_docker_registry_admin_password if not docker_stack__swarm_mode
      else 'dksec://docker_registry_admin_password' }}"

  LDAP_USERNAME: "{{
