---

__docker_stack__keycloak__image: quay.io/keycloak/keycloak:26.7.1
#__docker_stack__keycloak__image: quay.io/keycloak/keycloak:11.0.3
#__docker_stack__keycloak__image: "quay.io/keycloak/keycloak:latest"

__docker_stack__keycloak__stack_dir: "{{ docker_stack__dir | d('/home/user/docker-dirs') }}"
__docker_stack__keycloak__base_dir_default: "{{ __docker_stack__keycloak__stack_dir }}/keycloak"
__docker_stack__keycloak__base_dir: "{{ docker_stack__keycloak__base_dir
  | d(__docker_stack__keycloak__base_dir_default, true) }}"

__docker_stack__keycloak__postgres_user: "{{ docker_stack__keycloak__postgres_user | d('keycloak', true) }}"
__docker_stack__keycloak__postgres_password: "{{ docker_stack__keycloak__postgres_password | d('password', true) }}"
__docker_stack__keycloak__admin_user: "{{ docker_stack__keycloak__admin_user | d('user', true) }}"
__docker_stack__keycloak__admin_password: "{{ docker_stack__keycloak__admin_password | d('password', true) }}"

__docker_stack__keycloak__internal_domain: "{{ docker_stack__internal_domain | d('example.int') }}"
__docker_stack__keycloak__external_domain: "{{ docker_stack__external_domain | d('example.com') }}"

__docker_stack__keycloak__external_hostname: "{{
  docker_stack__keycloak__external_hostname
  | d(__docker_stack__keycloak__external_hostname_default, true) }}"

__docker_stack__keycloak__internal_hostname: "{{
  docker_stack__keycloak__internal_hostname
  | d(__docker_stack__keycloak__internal_hostname_default, true) }}"

__docker_stack__keycloak__environment_default:
  KC_DB: postgres
  KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
  KC_DB_USERNAME: "{{ __docker_stack__keycloak__postgres_user }}"
  KC_HOSTNAME: "{{ __docker_stack__keycloak__internal_hostname }}"
  KC_PROXY_HEADERS: "xforwarded"
  KC_HTTP_ENABLED: "true"
  # Optional but useful
  KC_HEALTH_ENABLED: "true"
  KC_METRICS_ENABLED: "true"

__docker_stack__keycloak__environment: "{{ docker_stack__keycloak__environment
  | d(__docker_stack__keycloak__environment_default, true) }}"

__docker_stack__keycloak__secrets:
  - name: keycloak_admin_user
    value: "{{ __docker_stack__keycloak__admin_user }}"
  - name: keycloak_admin_password
    value: "{{ __docker_stack__keycloak__admin_password }}"
  - name: keycloak_postgres_password
    value: "{{ __docker_stack__keycloak__postgres_password }}"

__docker_stack__keycloak__config_dirs:
  - path: "{{ __docker_stack__keycloak__base_dir }}"
  - path: "{{ __docker_stack__keycloak__base_dir }}/data"
  - path: "{{ __docker_stack__keycloak__base_dir }}/themes"
  - path: "{{ __docker_stack__keycloak__base_dir }}/providers"

__docker_stack__keycloak__config_templates:
  - src: keycloak/config-group.conf.j2
    dest: "{{ __docker_stack__keycloak__base_dir }}/group"
  - src: keycloak/config-passwd.conf.j2
    dest: "{{ __docker_stack__keycloak__base_dir }}/passwd"
  - src: keycloak/keycloak.env.j2
    dest: "{{ __docker_stack__keycloak__base_dir }}/keycloak.env"

__docker_stack__keycloak__volumes:
  keycloak_data: {}

docker_stack__appspec__keycloak:
  dirs: "{{ __docker_stack__keycloak__config_dirs | d([], true) }}"
  files: "{{ __docker_stack__keycloak__config_files | d([], true) }}"
  templates: "{{ __docker_stack__keycloak__config_templates | d([], true) }}"
  secrets: "{{ __docker_stack__keycloak__secrets | d([], true) }}"
  firewalld_services: "{{ __docker_stack__keycloak__firewalld_services | d([], true) }}"
  firewalld_ports: "{{ __docker_stack__keycloak__firewalld_ports | d([], true) }}"
  networks: "{{ __docker_stack__keycloak__networks | d([], true) }}"
  volumes: "{{ __docker_stack__keycloak__volumes | d([], true) }}"
  docker_services: "{{ __docker_stack__keycloak__services | d([], true) }}"

__docker_stack__keycloak__traefik_labels: "{{ docker_stack__keycloak__traefik_labels | d(__docker_stack__keycloak__traefik_labels_default, true) }}"

__docker_stack__keycloak__swarm_entrypoint: [ "/bin/bash", "-c" ]
__docker_stack__keycloak__swarm_command:
  - |
    export KC_DB_PASSWORD=$$(cat /run/secrets/keycloak_postgres_password)
    export KC_BOOTSTRAP_ADMIN_USERNAME=$$(cat /run/secrets/keycloak_admin_user)
    export KC_BOOTSTRAP_ADMIN_PASSWORD=$$(cat /run/secrets/keycloak_admin_password)
    /opt/keycloak/bin/kc.sh build
    exec /opt/keycloak/bin/kc.sh start --optimized

__docker_stack__keycloak__services:
  keycloak:
    container_name: keycloak
    image: "{{ __docker_stack__keycloak__image }}"
    entrypoint: "{{ __docker_stack__keycloak__swarm_entrypoint if docker_stack__swarm_mode else omit }}"
    command: "{{ __docker_stack__keycloak__swarm_command if docker_stack__swarm_mode else omit }}"
    user: "{{ docker_stack__user_uid }}:0"
    env_file:
      - "keycloak/keycloak.env"
    secrets: "{{ __docker_stack__keycloak__secrets
      | d({}, true) | map(attribute='name') | list }}"
    depends_on:
      - postgres
    links:
      - postgres
    restart: unless-stopped
    networks:
      - "{{ docker_stack__network_name__traefik_proxy }}"
      - "{{ docker_stack__network_name__default }}"
    ports:
      - 8081:8080
    volumes:
      - "{{ __docker_stack__ca_cert_bundle }}:/etc/ssl/certs/ca-certificates.crt:ro"
#      - "{{ __docker_stack__ca_java_keystore }}:/etc/ssl/certs/java/cacerts"
      - "{{ __docker_stack__keycloak__stack_dir }}/keycloak/themes:/opt/keycloak/themes/custom:rw"
      # Custom providers
      - "{{ __docker_stack__keycloak__stack_dir }}/keycloak/providers:/opt/keycloak/themes/providers:rw"
      - "{{ __docker_stack__keycloak__stack_dir }}/keycloak/data:/opt/keycloak/data"
    healthcheck:
      test:
        - CMD-SHELL
        - 'exec 3<>/dev/tcp/localhost/9000; echo -e "GET /health/ready HTTP/1.0\r\n\r\n" >&3; cat <&3 | grep -q "200 OK"'
      interval: 5s
      timeout: 2s
      retries: 15
      start_period: 240s
    deploy:
      mode: replicated
      placement:
        constraints:
          - node.role == manager
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 60s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 60s
        order: stop-first
    labels: "{{ __docker_stack__keycloak__traefik_labels }}"
