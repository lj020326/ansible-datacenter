---

__docker_stack__ollama__stack_dir: "{{ docker_stack__dir | d('/home/user/docker-dirs') }}"
__docker_stack__ollama__base_dir_default: "{{ __docker_stack__ollama__stack_dir }}/ollama"
__docker_stack__ollama__base_dir: "{{ docker_stack__ollama__dir | d(__docker_stack__ollama__base_dir_default) }}"
__docker_stack__ollama__data_dir: "{{ __docker_stack__ollama__base_dir }}/data"

__docker_stack__ollama__image_default: "ollama/ollama:latest"
__docker_stack__ollama__image: "{{ docker_stack__ollama__image | d(__docker_stack__ollama__image_default) }}"

# Host address
__docker_stack__ollama__domain: "{{ docker_stack__internal_domain | d('example.int') }}"
__docker_stack__ollama__host_addr_default: "ollama.{{ __docker_stack__ollama__domain }}"
__docker_stack__ollama__host_addr: "{{ docker_stack__ollama__host_addr
  | d(__docker_stack__ollama__host_addr_default) }}"

# Listener bind ports
__docker_stack__ollama__http_port: "{{ docker_stack__ollama__http_port | d('11434') }}"
__docker_stack__ollama__internal_http_port: "{{ docker_stack__ollama__internal_http_port | d('11434') }}"
__docker_stack__ollama__internal_http_host: "0.0.0.0:{{ __docker_stack__ollama__internal_http_port }}"

#__docker_stack__ollama__host_default: "{{ __docker_stack__ollama__host_addr }}"
__docker_stack__ollama__host_default: "host.docker.internal"
__docker_stack__ollama__host: "{{ docker_stack__ollama__host
  | d(__docker_stack__ollama__host_default) }}"

__docker_stack__ollama__container_home_dir_default: "/ollama"
__docker_stack__ollama__container_home_dir: "{{ docker_stack__ollama__container_home_dir
  | d(__docker_stack__ollama__container_home_dir_default) }}"

__docker_stack__ollama__origins_default:
  - "https://{{ __docker_stack__ollama__host_addr }}"
  - "http://localhost:*"
  - "http://127.0.0.1:*"

__docker_stack__ollama__origins: "{{ docker_stack__ollama__origins
  | d(__docker_stack__ollama__origins_default) }}"

__docker_stack__ollama__debug: "{{ docker_stack__ollama__debug | d(false) }}"

  # Add to Ollama systemd unit / environment setup:
  # optional: keep models loaded longer
#__docker_stack__ollama__keep_alive_default: "24h"
#__docker_stack__ollama__keep_alive_default: "1h"
__docker_stack__ollama__keep_alive_default: "5m"
__docker_stack__ollama__keep_alive: "{{ docker_stack__ollama__keep_alive | d('5m') }}"

# Ensure OLLAMA_MAX_LOADED_MODELS=1 to force Ollama to unload current model before loading another model
__docker_stack__ollama__max_loaded_models: "{{ docker_stack__ollama__max_loaded_models | d('1') }}"

__docker_stack__ollama__environment_default:
  OLLAMA_HOST: "{{ __docker_stack__ollama__internal_http_host }}"
  OLLAMA_ORIGINS: "{{ __docker_stack__ollama__origins | join(',') }}"
  OLLAMA_DEBUG: "{{ __docker_stack__ollama__debug }}"
  OLLAMA_KEEP_ALIVE: "{{ __docker_stack__ollama__keep_alive }}"
  OLLAMA_MAX_LOADED_MODELS: "{{ __docker_stack__ollama__max_loaded_models }}"
  OLLAMA_MODELS: "{{ __docker_stack__ollama__container_home_dir }}/.ollama/models"

  # Change this from /root to /ollama
  HOME: "{{ __docker_stack__ollama__container_home_dir }}"

__docker_stack__ollama__environment: "{{ docker_stack__ollama__environment
  | d(__docker_stack__ollama__environment_default) }}"

__docker_stack__ollama__config_dirs:
  - path: "{{ __docker_stack__ollama__base_dir }}"
  - path: "{{ __docker_stack__ollama__data_dir }}"
  - path: "{{ __docker_stack__ollama__data_dir }}/.ollama"
  - path: "{{ __docker_stack__ollama__data_dir }}/.ollama/models"

__docker_stack__ollama__config_files:
  - src: "ollama/fix-ollama-perms.sh"
    dest: "{{ __docker_stack__ollama__base_dir }}/fix-ollama-perms.sh"
    mode: "0755"
  - src: "ollama/ollama-model-status.sh"
    dest: "{{ __docker_stack__ollama__base_dir }}/ollama-model-status.sh"
    mode: "0755"
  - src: "scripts/llm-utils.sh"
    dest: "{{ __docker_stack__ollama__base_dir }}/llm-utils.sh"
    mode: "0755"

__docker_stack__ollama__config_templates:
  - src: ollama/ollama.env.j2
    dest: "{{ __docker_stack__ollama__base_dir }}/ollama.env"

__docker_stack__ollama__firewalld_ports:
  - "{{ __docker_stack__ollama__http_port }}/tcp"

docker_stack__appspec__ollama:
  dirs: "{{ __docker_stack__ollama__config_dirs | d([], true) }}"
  files: "{{ __docker_stack__ollama__config_files | d([], true) }}"
  templates: "{{ __docker_stack__ollama__config_templates | d([], true) }}"
  secrets: "{{ __docker_stack__ollama__secrets | d({}, true) }}"
  firewalld_services: "{{ __docker_stack__ollama__firewalld_services | d([], true) }}"
  firewalld_ports: "{{ __docker_stack__ollama__firewalld_ports | d([], true) }}"
  docker_services: "{{ __docker_stack__ollama__services | d({}, true) }}"

__docker_stack__ollama__deploy_resources_standalone:
  reservations:
    devices:
      - driver: nvidia
        count: all
        capabilities: [gpu]
#      - driver: nvidia
#        # or device_ids: ["0"] if you want specific GPU
#        count: 1
#        capabilities: [gpu]

__docker_stack__ollama__deploy_resources_swarm:
  reservations:
    generic_resources:
      - discrete_resource_spec:
          kind: NVIDIA-GPU
          value: 1

__docker_stack__ollama__deploy_resources: "{{ __docker_stack__ollama__deploy_resources_swarm
  if docker_stack__swarm_mode else __docker_stack__ollama__deploy_resources_standalone }}"

__docker_stack__ollama__traefik_labels: "{{ docker_stack__ollama__traefik_labels
  | d(__docker_stack__ollama__traefik_labels_default) }}"

__docker_stack__ollama__services:
  ollama:
    container_name: ollama
    image: "{{ __docker_stack__ollama__image }}"
    user: "{{ docker_stack__user_uid }}:{{ docker_stack__user_gid }}"
    restart: unless-stopped
    env_file:
      - ollama/ollama.env
    networks:
      - "{{ docker_stack__network_name__traefik_proxy }}"
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - "{{ __docker_stack__ollama__data_dir }}:{{ __docker_stack__ollama__container_home_dir }}"
    labels: "{{ __docker_stack__ollama__traefik_labels }}"
    deploy:
      mode: replicated
      placement:
        constraints:
          - node.role == manager
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
      # Explicitly designed to interface with the nvidia-container-toolkit CLI layer on single-node environments.
      resources: "{{ __docker_stack__ollama__deploy_resources }}"
