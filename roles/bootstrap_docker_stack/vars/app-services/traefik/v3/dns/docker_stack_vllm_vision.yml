---

#__docker_stack__vllm_vision__endpoint: "vault.{{ __docker_stack__vllm_vision__domain }}"

__docker_stack__vllm_vision__traefik_labels_base_default:
  - "traefik.enable=true"
  - "traefik.http.routers.vllm-vision.entrypoints=https"
  - "traefik.http.routers.vllm-vision.rule=Host(`{{ __docker_stack__vllm_vision__host_addr }}`)"
  - "traefik.http.routers.vllm-vision.service=vllm-vision-svc"
  # Add middleware to ensure X-Forwarded-Proto is set to https
  - "traefik.http.services.vllm-vision-svc.loadbalancer.server.port={{ __docker_stack__vllm_vision__internal_http_port }}"
  - "traefik.http.services.vllm-vision-svc.loadbalancer.server.scheme=http"

__docker_stack__vllm_vision__traefik_labels_default: >-
  {{
    __docker_stack__vllm_vision__traefik_labels_base_default
    + (__docker_stack__traefik__labels_swarm_default if docker_stack__swarm_mode | bool else [])
  }}
