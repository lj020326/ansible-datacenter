---

__docker_stack__repo_mcp__host_addr_default: "repo-mcp.{{ __docker_stack__repo_mcp__domain }}"

__docker_stack__repo_mcp__traefik_labels_base_default:
  - "traefik.enable=true"
  - "traefik.http.routers.repo-mcp.entrypoints=https"
  - "traefik.http.routers.repo-mcp.rule=Host(`{{ __docker_stack__repo_mcp__host_addr }}`)"
  - "traefik.http.routers.repo-mcp.service=repo-mcp-svc"
  # Add middleware to ensure X-Forwarded-Proto is set to https
  - "traefik.http.services.repo-mcp-svc.loadbalancer.server.port={{ __docker_stack__repo_mcp__internal_http_port }}"
  - "traefik.http.services.repo-mcp-svc.loadbalancer.server.scheme=http"

__docker_stack__repo_mcp__traefik_labels_default: >-
  {{
    __docker_stack__repo_mcp__traefik_labels_base_default
    + (__docker_stack__traefik__labels_swarm_default if docker_stack__swarm_mode | bool else [])
  }}
