---

__docker_stack__repo_proxy__traefik_labels_base_default:
  - "traefik.enable=true"
  - "traefik.http.routers.repo-proxy.entrypoints=https"
  - "traefik.http.routers.repo-proxy.rule=Host(`{{ __docker_stack__repo_proxy__host_addr }}`)"
  - "traefik.http.routers.repo-proxy.service=repo-proxy-svc"
  # Add middleware to ensure X-Forwarded-Proto is set to https
  - "traefik.http.services.repo-proxy-svc.loadbalancer.server.port={{ __docker_stack__repo_proxy__internal_http_port }}"
  - "traefik.http.services.repo-proxy-svc.loadbalancer.server.scheme=http"

__docker_stack__repo_proxy__traefik_labels_default: >-
  {{
    __docker_stack__repo_proxy__traefik_labels_base_default
    + (__docker_stack__traefik__labels_swarm_default if docker_stack__swarm_mode | bool else [])
  }}
