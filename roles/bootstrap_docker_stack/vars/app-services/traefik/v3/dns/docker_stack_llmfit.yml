---

#__docker_stack__llmfit__endpoint: "vault.{{ __docker_stack__llmfit__domain }}"

__docker_stack__llmfit__traefik_labels_base_default:
  - "traefik.enable=true"
  - "traefik.http.routers.llmfit.entrypoints=https"
  - "traefik.http.routers.llmfit.rule=Host(`{{ __docker_stack__llmfit__host_addr }}`)"
  - "traefik.http.routers.llmfit.service=llmfit-svc"
  # Add middleware to ensure X-Forwarded-Proto is set to https
  - "traefik.http.services.llmfit-svc.loadbalancer.server.port={{ __docker_stack__llmfit__internal_http_port }}"
  - "traefik.http.services.llmfit-svc.loadbalancer.server.scheme=http"

__docker_stack__llmfit__traefik_labels_default: >-
  {{
    __docker_stack__llmfit__traefik_labels_base_default
    + (__docker_stack__traefik__labels_swarm_default if docker_stack__swarm_mode | bool else [])
  }}
