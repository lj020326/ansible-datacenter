---

__docker_stack__dgx_dashboard__proxy_config:
  http:
    routers:
      dgx-dashboard-rtr:
        rule: Host(`dashboard.{{ docker_stack__internal_domain }}`)
        entryPoints:
          - https
        service: dgx-dashboard-svc
    services:
      dgx-dashboard-svc:
        loadBalancer:
          servers:
            - url: "{{ __docker_stack__proxyspec__dgx_dashboard_backend }}"
