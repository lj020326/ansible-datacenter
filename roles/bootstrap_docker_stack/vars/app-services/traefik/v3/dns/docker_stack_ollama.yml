---

#__docker_stack__ollama__endpoint: "vault.{{ __docker_stack__ollama__domain }}"

__docker_stack__ollama__traefik_labels_base_default:
  - "traefik.enable=true"
  - "traefik.http.routers.ollama.entrypoints=https"
  - "traefik.http.routers.ollama.rule=Host(`{{ __docker_stack__ollama__host_addr }}`)"
  - "traefik.http.routers.ollama.service=ollama-svc"
  - "traefik.http.routers.ollama.middlewares=chain-basic-auth@file"
  # Add middleware to ensure X-Forwarded-Proto is set to https
  - "traefik.http.services.ollama-svc.loadbalancer.server.port={{ __docker_stack__ollama__internal_http_port }}"
  - "traefik.http.services.ollama-svc.loadbalancer.server.scheme=http"

__docker_stack__ollama__traefik_labels_default: >-
  {{
    __docker_stack__ollama__traefik_labels_base_default
    + (__docker_stack__traefik__labels_swarm_default if docker_stack__swarm_mode | bool else [])
  }}
