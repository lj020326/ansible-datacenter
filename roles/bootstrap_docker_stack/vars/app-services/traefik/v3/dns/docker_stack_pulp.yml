---
__docker_stack__pulp__host_addr_default: "pulp.{{ __docker_stack__pulp__domain }}"
__docker_stack__pulp__host_addr_ui_default: "pulp-ui.{{ __docker_stack__pulp__domain }}"

__docker_stack__pulp__traefik_labels_base_default:
  - "traefik.enable=true"
  - "traefik.http.routers.pulp.rule=Host(`{{ __docker_stack__pulp__host_addr }}`)"
  - "traefik.http.routers.pulp.entrypoints=https"
  - "traefik.http.routers.pulp.tls=true"
  - "traefik.http.services.pulp.loadbalancer.server.port=80"

__docker_stack__pulp__traefik_labels_default: >-
  {{
    __docker_stack__pulp__traefik_labels_base_default
    + (__docker_stack__traefik__labels_swarm_default if docker_stack__swarm_mode | bool else [])
  }}

__docker_stack__pulp__traefik_labels_ui_base_default:
  - "traefik.enable=true"
  - "traefik.http.routers.pulp-ui.rule=Host(`{{ __docker_stack__pulp__host_addr_ui_default }}`)"
  - "traefik.http.routers.pulp-ui.entrypoints=https"
  - "traefik.http.routers.pulp-ui.tls=true"
  - "traefik.http.services.pulp-ui.loadbalancer.server.port=8002"

__docker_stack__pulp__traefik_labels_ui_default: >-
  {{
    __docker_stack__pulp__traefik_labels_ui_base_default
    + (__docker_stack__traefik__labels_swarm_default if docker_stack__swarm_mode | bool else [])
  }}
