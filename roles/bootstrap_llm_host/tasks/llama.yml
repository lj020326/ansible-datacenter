---
- name: llama | Display ansible_python_interpreter
  ansible.builtin.debug:
    var: ansible_python_interpreter

- name: llama | Assert bootstrap_llm_host__llama_runtime is valid
  ansible.builtin.assert:
    that: bootstrap_llm_host__llama_runtime in __bootstrap_llm_host__runtime_choices

- name: llama | Install huggingface_hub CLI into ansible venv
  become: true
  ansible.builtin.pip:
    name: "huggingface_hub[cli,hf_transfer]"
    state: present

- name: llama | Ensure model directory exists on host
  ansible.builtin.file:
    path: "{{ bootstrap_llm_host__llama_host_volume_path }}"
    state: directory
    owner: "{{ bootstrap_llm_host__ollama_user | default('container-user') }}"
    group: "{{ bootstrap_llm_host__ollama_user | default('container-user') }}"
    mode: '0755'
  become: true

- name: llama | Display ansible_facts['user_dir']
  become: true
  ansible.builtin.debug:
    var: ansible_facts['user_dir']

- name: llama | Display ansible_facts.env.PATH
  become: true
  ansible.builtin.debug:
    var: ansible_facts.env.PATH

- name: llama | Check if GGUF models already exist locally
  ansible.builtin.stat:
    path: "{{ bootstrap_llm_host__llama_host_volume_path }}/{{ item.filename }}"
  loop: "{{ bootstrap_llm_host__llama_models }}"
  register: __gguf_model_stats

