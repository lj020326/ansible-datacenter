#  ## CHAT & EDIT MODELS
#  - name: "qwen2.5-coder:32b"
##  - name: "qwen3-coder:32b"
#  ## FOR QUICK LOCAL TASKS
#  - name: "llama3.1:8b"
#  - name: "nomic-embed-text"
#  - name: "bona/bge-reranker-v2-m3"
#  # ~17 GB VRAM at Q4_K_M, excellent coding/reasoning
#  - name: qwen3.5:27b
#    type: pull
#  # optional lighter variant
#  - name: qwen3.5:14b
#    type: pull
#  # For pure coding focus (if available): qwen3-coder:32b or similar
