---
- name: Display key parameters for {{ role_name }}
  block:
    - name: Display bootstrap_linux_cron__list
      ansible.builtin.debug:
        var: bootstrap_linux_cron__list

    - name: Display bootstrap_linux_cron__state
      ansible.builtin.debug:
        var: bootstrap_linux_cron__state

- name: Show variables with 'bootstrap_linux_cron__list__' in their names
  ansible.builtin.debug:
    msg: "{{ lookup('varnames', '^bootstrap_linux_cron__list__', wantlist=True) }}"

- name: Init __bootstrap_linux_cron__list
  ansible.builtin.set_fact:
    __bootstrap_linux_cron__list: "{{ bootstrap_linux_cron__list | d([], true) }}"

- name: Combine bootstrap_linux_cron__list__* vars into merged list
  ansible.builtin.set_fact:
    __bootstrap_linux_cron__list: "{{ __bootstrap_linux_cron__list | d([], true) + lookup('vars', item) | d([], true) }}"
  loop: "{{ lookup('varnames','^bootstrap_linux_cron__list__', wantlist=True) }}"

- name: Display __bootstrap_linux_cron__list
  ansible.builtin.debug:
    var: __bootstrap_linux_cron__list

- name: Display __bootstrap_linux_cron__list
  ansible.builtin.debug:
    var: __bootstrap_linux_cron__list

- name: Remove cron job files
  when:
    - item.state | d('', true) == "absent"
    - item.cron_file | d('', true) | length > 0
  ansible.builtin.file:
    path: /etc/cron.d/{{ item.cron_file }}
    state: absent
  loop: "{{ __bootstrap_linux_cron__list }}"

- name: Ensure cron jobs using schedule array format [min, hour, day, month, weekday]
  when:
    - item.name | d('', true) | length > 0
    - item.schedule | d('', true) | length > 0
  ansible.builtin.cron:
    name: "{{ item.name }}"
    state: "{{ item.state | d(omit, true) }}"
    disabled: "{{ item.disabled | d(omit, true) }}"
    backup: "{{ item.backup | d(omit, true) }}"
    job: "{{ item.job | d(omit, true) }}"
    user: "{{ item.user | d('root', true) }}"
    minute: "{{ item.schedule[0] | d(omit, true) }}"
    hour: "{{ item.schedule[1] | d(omit, true) }}"
    day: "{{ item.schedule[2] | d(omit, true) }}"
    month: "{{ item.schedule[3] | d(omit, true) }}"
    weekday: "{{ item.schedule[4] | d(omit, true) }}"
    cron_file: "{{ item.cron_file | d(omit, true) }}"
  loop: "{{ __bootstrap_linux_cron__list }}"

- name: Ensure cron jobs using standard module inputs
  when:
    - item.job | d('', true) | length > 0
    - not item.schedule | d('', true) | length > 0
  ansible.builtin.cron:
    name: "{{ item.name | d(omit, true) }}"
    state: "{{ item.state | d(omit, true) }}"
    disabled: "{{ item.disabled | d(omit, true) }}"
    backup: "{{ item.backup | d(omit, true) }}"
    job: "{{ item.job }}"
    user: "{{ item.user | d('root', true) }}"
    minute: "{{ item.minute | d(omit, true) }}"
    hour: "{{ item.hour | d(omit, true) }}"
    day: "{{ item.day | d(omit, true) }}"
    month: "{{ item.month | d(omit, true) }}"
    weekday: "{{ item.weekday | d(omit, true) }}"
    special_time: "{{ item.special_time | d(omit, true) }}"
    cron_file: "{{ item.cron_file | d(omit, true) }}"
  loop: "{{ __bootstrap_linux_cron__list }}"
