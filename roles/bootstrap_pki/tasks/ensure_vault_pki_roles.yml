---
- name: "ensure-pki-roles[{{ __current_role.name }}] : Display __current_role"
  ansible.builtin.debug:
    var: __current_role

- name: "ensure-pki-roles[{{ __current_role.name }}] : Configure role in Vault PKI"
  no_log: true
  community.hashi_vault.vault_write:
    url: "{{ bootstrap_pki__vault_url }}"
    token: "{{ bootstrap_pki__vault_token }}"
    path: "{{ bootstrap_pki__vault_mount_path }}/roles/{{ __current_role.name }}"
    data:
      allow_glob_domains: "{{ __current_role.allow_glob_domains | d(omit, true) }}"
      allow_ip_sans: "{{ __current_role.allow_ip_sans | d(omit, true) }}"
      allow_localhost: "{{ __current_role.allow_localhost | d(omit, true) }}"
      allow_subdomains: "{{ __current_role.allow_subdomains | d(omit, true) }}"
      allow_wildcard_certificates: "{{ __current_role.allow_wildcard_certificates | d(omit, true) }}"
      allowed_domains: "{{ __current_role.allowed_domains }}"
      allowed_other_sans: "{{ __current_role.allowed_other_sans | d(omit, true) }}"
      client_flag: "{{ __current_role.client_flag | d(true, true) }}"
      country: "{{ __current_role.country | d(omit, true) }}"
      generate_lease: "{{ __current_role.generate_lease | d(omit, true) }}"
      issuer_ref: "{{ __current_role.issuer_ref | d(omit, true) }}"
      key_bits: "{{ __current_role.key_bits | d(256, true) }}"
      key_type: "{{ __current_role.key_type | d('ec', true) }}"
      key_usage: "{{ __current_role.key_usage | d(omit, true) }}"
      ext_key_usage: "{{ __current_role.ext_key_usage | d(omit, true) }}"
      locality: "{{ __current_role.locality | d(omit, true) }}"
      max_ttl: "{{ __current_role.max_ttl | d(omit, true) }}"
      organization: "{{ __current_role.organization | d(omit, true) }}"
      ou: "{{ __current_role.organizational_unit | d(omit, true) }}"
      # Optional: if you ever want to enforce policy_identifier or other advanced fields
      # policy_identifiers: "{{ __current_role.policy_identifiers | d(omit, true) }}"
      province: "{{ __current_role.province | d(omit, true) }}"
      require_cn: "{{ __current_role.require_cn | d(omit, true) }}"
      server_flag: "{{ __current_role.server_flag | d(true, true) }}"
      ttl: "{{ __current_role.ttl | d(omit, true) }}"
    validate_certs: false
  register: __pki_role_result
  delegate_to: localhost
  run_once: true

- name: "ensure-pki-roles[{{ __current_role.name }}] : Display role update result"
  ansible.builtin.debug:
    var: __pki_role_result
    verbosity: 1
  delegate_to: localhost
  run_once: true

- name: "ensure-pki-roles[{{ __current_role.name }}] : Assert role created successfully"
  ansible.builtin.assert:
    that:
      - not __pki_role_result.failed
      - __pki_role_result.data.data.allowed_domains | d([], true) | length > 0
    success_msg: "PKI role '{{ __current_role.name }}' configured successfully."
    fail_msg: |
      Failed to configurePKI role '{{ __current_role.name }}'.
      Errors: {{ __pki_role_result.errors | d('None', true) }}
      Data keys: {{ __pki_role_result.data.data.keys() | list }}
      Check token perms on {{ bootstrap_pki__vault_mount_path }}/roles/*.
  delegate_to: localhost
  run_once: true
