---

- name: "PRE-CHECK | Audit and gather live ESXi host state across cluster"
  ansible.builtin.include_tasks: pre_check_esxi_host_portgroups.yml
  loop: "{{ __esx_hosts_by_name | dict2items }}"
  loop_control:
    loop_var: _esx_host_entry
    label: "{{ item.key }}"

# ==============================================================================
# EXECUTION | Provision vSwitches, Portgroups, and VMkernel Adapters
# ==============================================================================

- name: "EXECUTE | Configure VMware vSwitches"
  community.vmware.vmware_vswitch:
    hostname: "{{ item.0.hostname }}"
    username: "{{ bootstrap_vsphere__esxi_username }}"
    password: "{{ bootstrap_vsphere__esxi_password }}"
    validate_certs: false
    esxi_hostname: "{{ item.0.hostname }}"
    switch: "{{ item.1.switch_name }}"
    nics: "{{ item.1.nics }}"
    teaming: "{{ item.1.teaming | d(omit, true) }}"
    mtu: "{{ item.1.mtu }}"
    security: "{{ item.1.security
      | d(item.1.security_policy)
      | d(item.1.network_policy)
      | d(bootstrap_vsphere_default_security_policy, true) }}"
  loop: "{{ __esx_hosts_by_name.values()
    | list | subelements('switches', { 'skip_missing': true }) }}"
  loop_control:
    label: "{{ item.0.hostname }} - {{ item.1.switch_name }}"

- name: "EXECUTE | Configure ESXi Portgroups per host mapping"
  community.vmware.vmware_portgroup:
    hostname: "{{ item.0.hostname }}"
    username: "{{ bootstrap_vsphere__esxi_username }}"
    password: "{{ bootstrap_vsphere__esxi_password }}"
    validate_certs: false
    esxi_hostname: "{{ item.0.hostname }}"
    switch_name: "{{ item.1.switch_name }}"
    portgroup: "{{ item.1.portgroup_name }}"
    vlan_id: "{{ item.1.vlan_id }}"
    security: "{{ item.1.security
      | d(item.1.security_policy)
      | d(item.1.network_policy)
      | d(bootstrap_vsphere_default_security_policy, true) }}"
  loop: "{{ __esx_hosts_by_name.values()
    | list | subelements('portgroups', { 'skip_missing': true }) }}"
  loop_control:
    label: "Ensure portgroup '{{ item.1.portgroup_name }}' exists on host '{{ item.0.hostname }}'"

- name: "EXECUTE | Build a unified list of host/vmkernel targets with fallbacks"
  ansible.builtin.set_fact:
    __target_vmkernels: "{{ __raw_vmkernel_list | from_yaml }}"
  vars:
    __raw_vmkernel_list: |
      {% for host_key, host_val in __esx_hosts_by_name.items() %}
      {% set vmks = host_val.vmkernels | default([]) %}
      {% if vmks | length > 0 %}
      {% for vmk in vmks %}
      - hostname: "{{ host_val.hostname }}"
        vmk: {{ vmk | to_json }}
      {% endfor %}
      {% else %}
      - hostname: "{{ host_val.hostname }}"
        vmk: {{ bootstrap_vsphere_default_vmkernel | to_json }}
      {% endif %}
      {% endfor %}

- name: "EXECUTE | Display __target_vmkernels"
  ansible.builtin.debug:
    var: __target_vmkernels
    verbosity: 1

- name: "EXECUTE | Ensure VMkernel adapter binding"
  community.vmware.vmware_vmkernel:
    hostname: "{{ item.hostname }}"
    username: "{{ bootstrap_vsphere__esxi_username }}"
    password: "{{ bootstrap_vsphere__esxi_password }}"
    validate_certs: false
    esxi_hostname: "{{ item.hostname }}"
    device: "{{ item.vmk.device
      | d(bootstrap_vsphere__vcenter_mgt_device, true) }}"
    vswitch_name: "{{ item.vmk.vswitch_name
      | d(bootstrap_vsphere__vcenter_mgt_vswitch, true) }}"
    portgroup_name: "{{ item.vmk.portgroup_name
      | d(bootstrap_vsphere__vcenter_mgt_network, true) }}"
    enable_mgmt: "{{ item.vmk.enable_mgmt | d(true, true) }}"
    enable_provisioning: "{{ item.vmk.enable_provisioning | d(false, true) }}"
    enable_replication: "{{ item.vmk.enable_replication | d(false, true) }}"
    enable_vmotion: "{{ item.vmk.enable_vmotion | d(true, true) }}"
    enable_vsan: "{{ item.vmk.enable_vsan | d(false, true) }}"
    network:
      type: "{{ item.vmk.network_type | default(item.vmk.type
        | d(bootstrap_vsphere__network_type, true)) }}"
      ip_address: "{{ item.vmk.ip_address | d(omit, true) }}"
      subnet_mask: "{{ item.vmk.subnet_mask | d(omit, true) }}"
    state: present
  loop: "{{ __target_vmkernels }}"
  loop_control:
    label: "Ensure {{ item.vmk.device | d('vmk0', true) }} present on '{{ item.hostname }}'"

- name: "POST-CHECK | Validate runtime consistency across all ESXi nodes"
  ansible.builtin.include_tasks: post_check_esxi_host_portgroups.yml
  loop: "{{ __esx_hosts_by_name | dict2items }}"
  loop_control:
    loop_var: _esx_host_entry
    label: "{{ item.key }}"

## ref: https://docs.ansible.com/ansible/latest/collections/community/vmware/vmware_host_dns_module.html#ansible-collections-community-vmware-vmware-host-dns-module
- name: prepare_esxi | Configure DNS for an ESXi host
  community.vmware.vmware_host_dns:
    hostname: "{{ item.hostname }}"
    username: "{{ bootstrap_vsphere__esxi_username }}"
    password: "{{ bootstrap_vsphere__esxi_password }}"
    validate_certs: false
    type: "{{ item.network_type | d('dhcp', true) }}"
    device: "{{ item.network_device | d('vmk0', true) }}"
    host_name: "{{ item.hostname }}"
    domain: "{{ item.dns_domain }}"
    dns_servers: "{{ item.dns_servers }}"
    search_domains: "{{ item.search_domains }}"
  loop: "{{ __esx_hosts_by_name.values() }}"
  loop_control:
    label: "{{ item.name }}"

- name: Mount NFS datastores
  community.vmware.vmware_host_datastore:
    hostname: "{{ item.0.hostname }}"
    username: "{{ bootstrap_vsphere__esxi_username }}"
    password: "{{ bootstrap_vsphere__esxi_password }}"
    validate_certs: false
    esxi_hostname: "{{ item.0.hostname }}"
    datastore_name: "{{ item.1.name }}"
    datastore_type: "{{ item.1.type }}"
    nfs_server: "{{ item.1.server }}"
    nfs_path: "{{ item.1.path }}"
    nfs_ro: false
    state: present
  loop: "{{ __esx_hosts_by_name.values()
    | list | subelements('datastores', { 'skip_missing': true }) }}"
  loop_control:
    label: "{{ item.0.hostname }} - {{ item.1.name }}"
