---
- name: Run minimum test
  hosts: 127.0.0.1
  connection: local
  tags:
    - minimum
  vars:
    ansible_unit_test: true
  roles:
    - role: ../.. # noqa: role-name[path]
      bootstrap_systemd_service__name: min
      bootstrap_systemd_service__service_execstart: /sbin/ping 127.0.0.1

- name: Run swarm-manager test
  hosts: 127.0.0.1
  connection: local
  tags:
    - swarm-manager
  vars:
    ansible_unit_test: true
  roles:
    - role: ../.. # noqa: role-name[path]
      bootstrap_systemd_service__name: swarm-manager
      bootstrap_systemd_service__envs:
        - DOCKER_HOST=tcp://127.0.0.1:2375
      bootstrap_systemd_service__unit_description: Docker Swarm Manager
      bootstrap_systemd_service__unit_requires: docker.service
      bootstrap_systemd_service__unit_after: docker.service
      bootstrap_systemd_service__service_execstartpre:
        - -/usr/bin/docker stop swarm-manager
        - -/usr/bin/docker rm swarm-manager
        - /usr/bin/docker pull swarm
      bootstrap_systemd_service__service_execstart: |
        /usr/bin/docker run -p 2377:2375 --name swarm-manager swarm manage

- name: Run full test
  hosts: 127.0.0.1
  connection: local
  tags:
    - full
  vars:
    ansible_unit_test: true
  roles:
    - role: ../.. # noqa: role-name[path]
      bootstrap_systemd_service__default_dir: /etc/hoge
      bootstrap_systemd_service__systemd_dir: /etc/fuga
      bootstrap_systemd_service__name: full
      bootstrap_systemd_service__envs:
        - abc=def
        - 123=256
      bootstrap_systemd_service__unit_description: full oiptions test
      bootstrap_systemd_service__unit_documentation: This is a test of full options.
      bootstrap_systemd_service__unit_requires: req1
      bootstrap_systemd_service__unit_wants:
        - wants
      bootstrap_systemd_service__unit_after: after
      bootstrap_systemd_service__unit_before: before
      bootstrap_systemd_service__service_type: type
      bootstrap_systemd_service__service_execstartpre: start pre
      bootstrap_systemd_service__service_execstart: start command
      bootstrap_systemd_service__service_execstartpost:
        - start post 1
        - start post 2
      bootstrap_systemd_service__service_restart: restart
      bootstrap_systemd_service__service_restartsec: 10
      bootstrap_systemd_service__service_execreload: reload
      bootstrap_systemd_service__service_execstop: stop
      bootstrap_systemd_service__service_execstoppost: stop post
      bootstrap_systemd_service__service_pidfile: pid
      bootstrap_systemd_service__service_busname: bus
      bootstrap_systemd_service__service_privatetmp: tmp
      bootstrap_systemd_service__service_limitnofile: 65536
      bootstrap_systemd_service__install_wantedby: wantedby
      bootstrap_systemd_service__install_requiredby: requiredby
      bootstrap_systemd_service__install_also: also
      bootstrap_systemd_service__install_alias: alias

- name: Run mapping test
  hosts: 127.0.0.1
  connection: local
  tags:
    - mapping
  vars:
    ansible_unit_test: true
  roles:
    - role: ../.. # noqa: role-name[path]
      bootstrap_systemd_service__name: min
      bootstrap_systemd_service__service_execstart: /sbin/ping 127.0.0.1
      bootstrap_systemd_service__envs:
        - abc: def
        - 123: 256
