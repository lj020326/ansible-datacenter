---

docker_stack__service_groups__pulp:
  - pulp

docker_stack__pulp__secret_key: "{{ vault__pulp_secret_key }}"
docker_stack__pulp__admin_username: "{{ vault__pulp_admin_username }}"
docker_stack__pulp__admin_password: "{{ vault__pulp_admin_password }}"
docker_stack__pulp__admin_email: "{{ vault__pulp_admin_email }}"
#docker_stack__pulp__force_password_reset: true

## make sure internal repo + dist is setup for internally developed collections
## https://pulp.media.johnson.int/pulp_ansible/galaxy/internal/
docker_stack__pulp__ansible_repo_name: "internal-collections"
docker_stack__pulp__ansible_distro_name: "internal-collections"
docker_stack__pulp__ansible_base_path: "internal" # ← this becomes the URL path
