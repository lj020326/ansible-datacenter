---

docker_stack__service_groups__vllm:
  - vllm

docker_stack__vllm__api_key: "{{ vault__vllm_api_key }}"

docker_stack__vllm__model: "Qwen/Qwen3-30B-A3B-FP8"

docker_stack__vllm__vikunja_agent_api_token: "{{ vault__vikunja_agent_api_token }}"
docker_stack__vllm__vikunja_agent_secret_key: "{{ vault__vikunja_jwt_secret }}"

# since plan is to run both vLLM and Ollama concurrently on gpu01
# ensure vLLM's --gpu-memory-utilization is capped (e.g., at 0.5 or 0.6)
# so it leaves unified RAM available for Ollama's instances
docker_stack__vllm__gpu_memory_utilization: '0.6'
