---

# Sized for RTX 4060 8GB VRAM - dedicated GPU memory is much
# smaller than the 3090 (24GB) or GB10 (128GB unified), so models here are
# capped so a single model + context/KV cache fits comfortably in ~8GB.
# Rule of thumb: keep model weights under ~5-6GB Q4_K_M to leave 2-3GB
# headroom for context window + KV cache before spilling to CPU offload.

bootstrap_llm_host__ollama_models:
  # ~4.7 GB CHAT & EDIT MODEL (general purpose, fits alongside small context)
  - name: "llama3.1:8b"
  # ~0.8 GB LIGHTWEIGHT AUTOCOMPLETE (use when you need max context headroom)
  - name: "qwen2.5-coder:1.5b"
  ## FOR QUICK LOCAL TASKS / RAG SUPPORT (all small, fine to keep loaded)
  - name: "nomic-embed-text"
  - name: "all-minilm:l6-v2"
  - name: "bona/bge-reranker-v2-m3"
