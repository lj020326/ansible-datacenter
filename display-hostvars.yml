---
- name: Gather facts for all hosts to apply OS specific group vars for them
  tags: always
  hosts: all
  ignore_unreachable: true
  tasks:
    - name: Set os info
      ansible.builtin.set_fact:
        os_family: "{{ 'os_linux'
          if ansible_facts['os_family'] | d('', true) | lower in ['debian','redhat']
          else ansible_facts['os_family'] | d('Unknown', true) }}"
        os_distribution: "os_{{ ansible_facts['distribution'] |d('Unknown') | lower | replace(' ', '_') }}"
        os_distribution_version: "os_{{ ansible_facts['distribution'] |d('Unknown') | lower
          | replace(' ', '_') }}_{{ ansible_facts['distribution_major_version']
          | d(ansible_facts['distribution_release']) | d('Unknown', true) | lower | replace('.', '_') | replace(' ', '_') }}"

    - name: Set os info for windows for vmware esx
      when: ansible_facts['os_family'] | d('', true) == 'VMkernel'
      ansible.builtin.set_fact:
        os_family: "dc_os_esxi"
        os_distribution: "esxi"
        os_distribution_version: "dc_os_esxi_{{ ansible_facts['distribution_major_version']
          | d(ansible_facts['distribution_release']) | d('Unknown', true) | lower | replace('.', '_') | replace(' ', '_') }}"

    - name: Set os info for windows for vmware vcenter
      when: ansible_facts['os_family'] | d('', true) == 'VMware Photon'
      ansible.builtin.set_fact:
        os_family: "os_vsphere"
        os_distribution: "vsphere"
        os_distribution_version: "os_vsphere_{{ ansible_facts['distribution'] | d('Unknown', true) | lower
          | replace(' ', '_') }}_v{{ ansible_facts['distribution_major_version'] | d('Unknown', true) }}"

    - name: Set os info for windows
      when: ansible_facts['os_family'] | d('', true) | lower is search('windows')
      ansible.builtin.set_fact:
        os_family: "os_windows"
        os_distribution: "windows"
        os_distribution_version: "os_windows_{{ ansible_facts['distribution'] | d('Unknown', true)
          | lower | replace(' ', '_') | regex_replace('(microsoft_|windows_)', '') }}"

    - name: Display os group classification info
      ansible.builtin.debug:
        msg:
          - os_family={{ os_family }}
          - os_distribution={{ os_distribution }}
          - os_distribution_version={{ os_distribution_version }}

    - name: Group hosts based on os_family
      changed_when: false
      ansible.builtin.group_by:
        key: "{{ os_family }}"

    ## ref: https://github.com/ansible/ansible/issues/76788
    - name: Group hosts based on os_distribution
      changed_when: false
      ansible.builtin.group_by:
        key: "{{ os_distribution }}"
        parents: "{{ os_family }}"

    - name: Group hosts based on os_distribution_version
      changed_when: false
      ansible.builtin.group_by:
        key: "{{ os_distribution_version }}"
        parents: "{{ os_distribution }}"

#    - name: Classify hosts depending on their internal domain
#      changed_when: no
#      ansible.builtin.group_by:
#        key: ca_domain_{{ ('_').join( inventory_hostname.split('.')[1::]|reverse ) | d(internal_domain) }}

- name: Display important common variable information
  tags: always
  hosts: all
  ignore_unreachable: true
  ignore_errors: true
  gather_facts: false
  tasks:
    - name: Display important common variable information
      when: inventory_hostname in ansible_play_hosts
      ansible.builtin.debug:
        msg:
          - inventory_hostname={{ inventory_hostname | d('unknown', true) }}
          - inventory_hostname_short={{ inventory_hostname_short | d('unknown', true) }}
          - internal_subdomain={{ internal_subdomain | d('', true) }}
          - internal_domain={{ internal_domain | d('unknown', true) }}
          - netbase__hostname={{ netbase__hostname }}
          - ansible_host={{ ansible_host }}
          - ansible_hostname={{ ansible_hostname | d('', true) }}
          - ansible_fqdn={{ ansible_fqdn | d('', true) }}
          - ansible_facts['default_ipv4'].address={{ ansible_facts['default_ipv4'].address | d(ansible_all_ipv4_addresses[0]) | d('', true) }}
          - ansible_os_family={{ ansible_os_family | d('unknown', true) }}
          - ansible_distribution={{ ansible_distribution | d('unknown', true) }}
          - ansible_distribution_release={{ ansible_distribution_release | d('unknown', true) }}
          - ansible_distribution_major_version={{ ansible_distribution_major_version | d('unknown', true) }}
          - ansible_python_interpreter={{ ansible_python_interpreter | d('unknown', true) }}
          - ansible_pip_interpreter={{ ansible_pip_interpreter | d('unknown', true) }}
          - os_python_interpreter={{ os_python_interpreter }}
          - ansible_python_interpreter={{ ansible_python_interpreter | d('unknown', true) }}
          - ansible_facts['pip_interpreter']={{ ansible_facts['pip_interpreter'] | d('unknown', true) }}
          - group_names={{ group_names | d('', true) }}
          - ntp_servers={{ ntp_servers | d('', true) }}
          - docker_stack_external_domain={{ docker_stack_external_domain | d('', true) }}
          - docker_stack_internal_domain={{ docker_stack_internal_domain | d('', true) }}
          - ca_domain={{ ca_domain | d('unknown', true) }}
          - ca_domains_hosted={{ ca_domains_hosted | d('', true) }}

## Debugging purposes: print all environment variables
## ref: https://gryzli.info/2017/12/21/ansible-debug-print-variables/
- name: "Debug: Print environment variables"
  hosts: all,!node_offline
  tags:
    - display-envvars
    - debug-envvars
    - debug-env-vars
  tasks:
    - name: Print env var debug information
      when: inventory_hostname in ansible_play_hosts
      ansible.builtin.debug:
        var: environment
      tags: debug_info

- name: Display hostvars
  hosts: all,!node_offline
  gather_facts: true
  tags:
    - debug-hostvars
    - display-hostvars
  tasks:
    - name: Print host variable information
      when: inventory_hostname in ansible_play_hosts
      ansible.builtin.debug:
        var: hostvars
      tags: debug_info
