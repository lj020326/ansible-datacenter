# =====================================================================
# CrewAI Doc Agent Configuration File - ansible-datacenter
# =====================================================================

version: "1.0"

logging:
  level: "INFO"

agent:
  name: "Ansible Datacenter Documentation Agent"
  model: "qwen-coder"
  api_base: "https://vllm-coder.llm-gb10.johnson.int/v1"
#  provider: "openai"
  provider: "custom_openai"
  max_tokens: 8192
  temperature: 0.2
  memory: false
  # debug_llm: true

memory:
  enabled: true
  storage_dir: ".agent_state/crewai"
  embedder:
    provider: "openai"
    auth_type: basic
    config:
      model_name: "nomic-embed-text:latest"
      api_base: "https://ollama.admin.johnson.int"

options:
  max_io_workers: 4
  max_subdir_files: 200
  max_subdir_lines: 25000

# Agent Role and Tool Mappings for Infrastructure / Ansible Repositories
agents:
  repo_context_analyst:
    role: >
      Ansible Infrastructure Context Analyst
    goal: >
      Thoroughly crawl, parse, and analyze the ansible-datacenter repository structure, roles, inventories, collections, and automated CI/CD workflows.
    backstory: >
      An expert DevOps platform architect specialized in configuration-as-code, Docker Swarm orchestration, and Ansible automation engineering.
    tools:
      - package_directory_tool

  senior_documentation_reviewer:
    role: >
      Senior Infrastructure Documentation Reviewer
    goal: >
      Synthesize architectural infrastructure context into clean, comprehensive, professional GitHub-Flavored Markdown documentation for roles, playbooks, and inventories.
    backstory: >
      A meticulous technical writer and platform documentation engineer dedicated to clear, maintainable infrastructure-as-code standards.
    tools:
      - write_repo_documentation
      - write_wiki_document
