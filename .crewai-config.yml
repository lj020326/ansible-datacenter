# ================================================
# CrewAI Documentation Agent Configuration
# ================================================

agent:
  name: "CrewAI Documentation & Analysis Agent"
  # api_base: "https://ollama.llm-gb10.johnson.int/api"
  # api_base: "https://ollama.llm-rtx.johnson.int/api"
  api_base: "https://ollama.llm-rtx.johnson.int/v1"
  auth_type: "basic"
  provider: "openai"
  temperature: 0.2
  max_tokens: 4096

  # model: "qwen3-coder-next:q4_K_M"
  # model: "qwen2.5-coder:32b"
  # model: "qwen2.5-coder:7b"
  # model: "gemma2:27b"
  model: "devstral:24b"

  # debug_llm: true

  # Tools enabled for the CrewAI Agent
  tools:
    - code_search
    - file_reader
    - doc_generator
